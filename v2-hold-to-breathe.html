<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold to Breathe</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-proof-lab.html" aria-label="Back to proof hub">‹</a>
      <div class="game-title"><strong>Hold to Breathe</strong><span>Hold to grow. Release to settle.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene breathe-world" id="stage" aria-label="Breathing hold area">
      <div class="premium-orb" id="orb" aria-hidden="true"></div>
      <div class="breath-prompt"><span>Hold to grow</span><span>Release to settle</span></div>
      <div class="floating-controls">
        <button id="settle" class="scene-button" type="button">Settle</button>
        <button id="expand" class="scene-button" type="button">Expand</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const stage = document.querySelector('#stage');
    const orb = document.querySelector('#orb');
    let scale = 1;
    let velocity = 0;
    let target = 1;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings);
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function setTarget(next) {
      target = next;
      if (!settings.allowsMotion()) {
        scale = target;
        orb.style.setProperty('--breath-scale', String(scale));
      }
    }
    motion.add((dt) => {
      const next = motion.spring(scale, target, velocity, 165, 20, dt);
      scale = next.value;
      velocity = next.velocity;
      orb.style.setProperty('--breath-scale', String(LeonSalV2.clamp(scale, 0.82, 1.62)));
    });
    new LeonSalV2.InputEngine(stage).onPointer({ down: () => setTarget(1.55), up: () => setTarget(1) });
    document.querySelector('#expand').addEventListener('pointerdown', () => setTarget(1.55));
    document.querySelector('#expand').addEventListener('pointerup', () => setTarget(1));
    document.querySelector('#settle').addEventListener('click', () => setTarget(1));
  </script>
</body>
</html>
