<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cause and Effect Engine</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Cause and Effect</strong><span>Tap a switch and watch the world respond.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene cause-world" id="stage" aria-label="Cause and effect demonstration">
      <div class="cause-house" id="house"><span></span></div>
      <div class="cause-sun" id="sun"></div>
      <div class="cause-garden" id="garden"></div>
      <div class="ambient-character cause-helper sun-helper" id="sunHelper" aria-hidden="true"></div>
      <div class="ambient-character cause-helper tree-helper" id="treeHelper" aria-hidden="true"></div>
      <div class="floating-controls cause-controls">
        <button class="scene-button" data-cause="light" type="button">Light</button>
        <button class="scene-button" data-cause="grow" type="button">Grow</button>
        <button class="scene-button" data-cause="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const engine = new LeonSalV2.CauseEffectEngine();
    const stage = document.querySelector('#stage');
    const sunHelper = document.querySelector('#sunHelper');
    const treeHelper = document.querySelector('#treeHelper');
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function renderWorldHelper(host, id, label, state) {
      const renderer = window.LeonSalCharacterRenderer;
      host.replaceChildren();
      if (renderer) host.append(renderer.makeCharacter({ id, displayName: label, family: 'world', registryGroup: 'world' }, state, { decorative: true }));
    }
    function renderHelpers() {
      renderWorldHelper(sunHelper, 'world-sun', 'Sun', stage.dataset.light === 'true' ? 'excited' : 'calm');
      renderWorldHelper(treeHelper, 'world-tree', 'Tree', stage.dataset.grow === 'true' ? 'happy' : 'low');
    }
    engine.connect('light', () => { stage.dataset.light = 'true'; renderHelpers(); });
    engine.connect('grow', () => { stage.dataset.grow = 'true'; renderHelpers(); });
    engine.connect('reset', () => { stage.dataset.light = 'false'; stage.dataset.grow = 'false'; renderHelpers(); });
    document.querySelectorAll('[data-cause]').forEach((button) => button.addEventListener('click', () => engine.trigger(button.dataset.cause)));
    window.__causeEffectProofState = () => ({
      light: stage.dataset.light,
      grow: stage.dataset.grow,
      registeredEffects: engine.effects.size,
      deterministicReset: stage.dataset.light === 'false' && stage.dataset.grow === 'false',
      hasCharacterRenderer: Boolean(sunHelper.querySelector('.procedural-character-svg.character-family-world')) && Boolean(treeHelper.querySelector('.procedural-character-svg.character-family-world')),
      reducedMotion: settings.value.reducedMotion,
      calmMode: settings.value.calmMode
    });
    const gameShell = new LeonSalGameShell({ settings, motions: [], audio: [], reset: () => engine.trigger('reset') });
    window.__causeEffectProofCleanup = () => {
      engine.destroy();
      gameShell.destroy();
    };
    engine.trigger('reset');
  </script>
</body>
</html>
