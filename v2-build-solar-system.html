<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build the Solar System</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Build the Solar System</strong><span>Place planets in order.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene solar-build-world" aria-label="Solar system building play area">
      <div class="solar-build-sun" aria-hidden="true"></div>
      <div class="solar-slots" id="slots" aria-label="Orbit slots"></div>
      <div class="solar-pieces" id="pieces" aria-label="Planet pieces"></div>
      <p class="scene-status" id="status">Place Mercury first.</p>
      <p class="scale-note">Order practice, not physical scale.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="place" type="button">Place next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const orbit = new LeonSalV2.OrbitEngine(motion, settings);
    const slots = document.querySelector('#slots');
    const pieces = document.querySelector('#pieces');
    const status = document.querySelector('#status');
    const planets = [
      { id: 'mercury', name: 'Mercury', colour: '#94a3b8' },
      { id: 'venus', name: 'Venus', colour: '#fbbf24' },
      { id: 'earth', name: 'Earth', colour: '#38bdf8' },
      { id: 'mars', name: 'Mars', colour: '#fb7185' }
    ];
    let assembly;
    let placed = [];
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function layoutPoints() {
      const rect = document.querySelector('.solar-build-world').getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height * .45;
      return planets.map((planet, index) => ({ id: planet.id, x: cx, y: cy - 78 - index * 38, tolerance: 56, radius: 78 + index * 38 }));
    }
    function render() {
      slots.innerHTML = '';
      pieces.innerHTML = '';
      const points = layoutPoints();
      assembly = new LeonSalV2.BuildAssemblyEngine(points);
      for (const planet of planets) {
        const point = points.find((candidate) => candidate.id === planet.id);
        const slot = document.createElement('span');
        slot.className = 'solar-slot';
        slot.dataset.planet = planet.id;
        slot.style.setProperty('--orbit-radius', `${point.radius * 2}px`);
        slot.textContent = planet.name;
        slots.append(slot);
        const piece = document.createElement('button');
        piece.className = `solar-piece ${planet.id}`;
        piece.type = 'button';
        piece.dataset.planet = planet.id;
        piece.style.setProperty('--planet-colour', planet.colour);
        piece.textContent = planet.name;
        piece.setAttribute('aria-label', `Place ${planet.name}`);
        pieces.append(piece);
      }
      syncPlaced();
    }
    function syncPlaced() {
      document.querySelectorAll('.solar-piece').forEach((piece) => {
        piece.dataset.placed = String(placed.includes(piece.dataset.planet));
      });
      document.querySelectorAll('.solar-slot').forEach((slot) => {
        slot.dataset.placed = String(placed.includes(slot.dataset.planet));
      });
      status.textContent = placed.length === planets.length ? 'Solar system built.' : `Place ${planets[placed.length].name} next.`;
    }
    function activateOrbit() {
      orbit.destroy();
      const rect = document.querySelector('.solar-build-world').getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height * .45;
      document.querySelectorAll('.solar-piece').forEach((piece, index) => {
        orbit.add({
          element: piece,
          cx,
          cy,
          radius: 78 + index * 38,
          angle: index * Math.PI * .55,
          speed: (.12 + index * .02) * (settings.value.calmMode ? .35 : 1),
          update: (item) => {
            item.element.style.position = 'absolute';
            item.element.style.left = '0';
            item.element.style.top = '0';
            item.element.style.transform = `translate(${item.x}px, ${item.y}px) translate(-50%, -50%)`;
          }
        });
      });
    }
    function placeNext() {
      const planet = planets[placed.length];
      if (!planet) return;
      const point = layoutPoints().find((candidate) => candidate.id === planet.id);
      if (assembly.snap(planet.id, point.x, point.y)) placed.push(planet.id);
      syncPlaced();
      if (placed.length === planets.length) activateOrbit();
    }
    function reset() {
      orbit.destroy();
      placed = [];
      render();
    }
    pieces.addEventListener('click', (event) => {
      const piece = event.target.closest('.solar-piece');
      if (!piece || placed.includes(piece.dataset.planet)) return;
      if (piece.dataset.planet === planets[placed.length].id) placeNext();
      else status.textContent = `Try ${planets[placed.length].name} first.`;
    });
    document.querySelector('#place').addEventListener('click', placeNext);
    document.querySelector('#reset').addEventListener('click', reset);
    settings.on('change', () => { if (placed.length === planets.length) activateOrbit(); });
    window.addEventListener('resize', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [orbit], reset, gameId: 'build-solar-system-v2' });
    reset();
    window.__solarBuildProofState = () => ({ placed: [...placed], complete: placed.length === planets.length, planetCount: planets.length, educationalScaleNote: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
