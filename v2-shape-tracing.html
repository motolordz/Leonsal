<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shape Tracing</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Shape Tracing</strong><span>Trace around simple shapes.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene shape-trace-world" aria-label="Shape tracing play area">
      <svg class="shape-trace-ghost" id="ghostShape" viewBox="0 0 320 320" aria-hidden="true"></svg>
      <canvas id="shapeTraceCanvas" class="trace-canvas" aria-label="Trace the circle. Drag along the path, or use the Step button."></canvas>
      <div class="trace-character-preview shape-trace-helper" id="shapeTraceHelper" aria-live="polite"></div>
      <p class="scene-status" id="status">Trace the circle.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="step" type="button">Step</button>
        <button class="scene-button" id="next" type="button">Next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const canvas = document.querySelector('#shapeTraceCanvas');
    const status = document.querySelector('#status');
    const ghost = document.querySelector('#ghostShape');
    const shapeTraceHelper = document.querySelector('#shapeTraceHelper');
    const shapes = ['circle', 'triangle', 'square', 'heart'];
    let shapeIndex = 0;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function currentShape() { return shapes[shapeIndex]; }
    function helperRecord() {
      return { id: 'world-puzzle', displayName: 'Shape Helper', family: 'world', registryGroup: 'world' };
    }
    function helperState() {
      const ratio = trace.path.length ? trace.progress / trace.path.length : 0;
      if (ratio >= 1) return 'excited';
      if (ratio >= .65) return 'happy';
      if (ratio >= .35) return 'calm';
      if (ratio > 0) return 'low';
      return 'empty';
    }
    function renderHelper() {
      const renderer = window.LeonSalCharacterRenderer;
      shapeTraceHelper.replaceChildren();
      if (renderer) {
        shapeTraceHelper.append(renderer.makeCharacter(helperRecord(), helperState(), { decorative: false }));
      }
    }
    function drawGhost() {
      const shape = currentShape();
      const common = 'fill="none" stroke="rgba(15,23,42,.08)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"';
      if (shape === 'circle') ghost.innerHTML = `<circle cx="160" cy="160" r="96" ${common}/>`;
      else if (shape === 'triangle') ghost.innerHTML = `<path d="M160 62 L260 244 L60 244 Z" ${common}/>`;
      else if (shape === 'square') ghost.innerHTML = `<rect x="72" y="72" width="176" height="176" rx="26" ${common}/>`;
      else ghost.innerHTML = `<path d="M160 254 C75 178 62 118 102 86 C130 64 153 78 160 105 C167 78 190 64 218 86 C258 118 245 178 160 254 Z" ${common}/>`;
    }
    function makePath() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const shape = currentShape();
      const points = [];
      const pushLine = (a, b, steps = 28) => {
        for (let i = 0; i <= steps; i += 1) points.push({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps });
      };
      if (shape === 'circle') {
        for (let i = 0; i <= 96; i += 1) {
          const t = -Math.PI / 2 + Math.PI * 2 * i / 96;
          points.push({ x: w * .5 + Math.cos(t) * w * .27, y: h * .5 + Math.sin(t) * h * .25 });
        }
      } else if (shape === 'triangle') {
        const a = { x: w * .5, y: h * .23 }, b = { x: w * .75, y: h * .7 }, c = { x: w * .25, y: h * .7 };
        pushLine(a, b); pushLine(b, c); pushLine(c, a);
      } else if (shape === 'square') {
        const a = { x: w * .27, y: h * .28 }, b = { x: w * .73, y: h * .28 }, c = { x: w * .73, y: h * .7 }, d = { x: w * .27, y: h * .7 };
        pushLine(a, b); pushLine(b, c); pushLine(c, d); pushLine(d, a);
      } else {
        for (let i = 0; i <= 104; i += 1) {
          const t = Math.PI * 2 * i / 104;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          points.push({ x: w * .5 + x * w * .018, y: h * .52 + y * h * .018 });
        }
      }
      return points;
    }
    const trace = new LeonSalV2.TraceEngine(canvas, motion, settings, { path: [], tolerance: 34 });
    function reset() {
      drawGhost();
      trace.setPath(makePath());
      status.textContent = `Trace the ${currentShape()}.`;
      canvas.setAttribute('aria-label', `Trace the ${currentShape()}. Drag along the path, or use the Step button.`);
      renderHelper();
    }
    function add(x, y) {
      const rect = canvas.getBoundingClientRect();
      const result = trace.addPoint(x - rect.left, y - rect.top);
      status.textContent = result.complete ? `${currentShape()} complete.` : result.near ? 'Keep tracing.' : 'Come back to the glow.';
      renderHelper();
    }
    new LeonSalV2.InputEngine(canvas).onPointer({ down: ({ x, y }) => add(x, y), move: ({ x, y }) => add(x, y) });
    document.querySelector('#step').addEventListener('click', () => {
      const point = trace.path[Math.min(trace.progress, trace.path.length - 1)];
      if (point) add(point.x + canvas.getBoundingClientRect().left, point.y + canvas.getBoundingClientRect().top);
    });
    document.querySelector('#next').addEventListener('click', () => { shapeIndex = (shapeIndex + 1) % shapes.length; reset(); });
    document.querySelector('#reset').addEventListener('click', reset);
    window.addEventListener('resize', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [trace], reset, gameId: 'shape-tracing-v2' });
    reset();
    window.__shapeTracingProofState = () => ({ shape: currentShape(), progress: trace.progress, complete: trace.progress >= trace.path.length, pathLength: trace.path.length, hasCharacterRenderer: Boolean(shapeTraceHelper.querySelector('.procedural-character-svg.character-family-world')), hasStepAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
