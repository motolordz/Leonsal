<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pattern Builder</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Pattern Builder</strong><span>Continue the gentle pattern.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene pattern-world" aria-label="Pattern building play area">
      <p class="scene-status" id="status">Choose what comes next.</p>
      <div class="pattern-ribbon" id="ribbon" aria-label="Pattern ribbon"></div>
      <div class="pattern-choices" id="choices">
        <button class="pattern-choice choice-sun" type="button" data-value="sun" aria-label="Sun">Sun</button>
        <button class="pattern-choice choice-moon" type="button" data-value="moon" aria-label="Moon">Moon</button>
      </div>
      <div class="drawer-controls">
        <button class="scene-button" id="next" type="button">Add next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const sequence = new LeonSalV2.SequenceEngine(['sun', 'moon', 'sun', 'moon', 'sun', 'moon']);
    const ribbon = document.querySelector('#ribbon');
    const status = document.querySelector('#status');
    const choiceHost = document.querySelector('#choices');
    let placed = [];
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function patternRecord(value) {
      return {
        id: value === 'sun' ? 'world-sun' : 'world-moon',
        displayName: value === 'sun' ? 'Sun' : 'Moon',
        family: 'world',
        registryGroup: 'world'
      };
    }
    function renderPatternCharacter(value, state) {
      const renderer = window.LeonSalCharacterRenderer;
      if (!renderer) return document.createTextNode(value === 'sun' ? 'Sun' : 'Moon');
      return renderer.makeCharacter(patternRecord(value), state, { decorative: false });
    }
    function renderChoiceButton(button) {
      const value = button.dataset.value;
      button.replaceChildren(renderPatternCharacter(value, 'calm'));
      const label = document.createElement('span');
      label.className = 'choice-label';
      label.textContent = value === 'sun' ? 'Sun' : 'Moon';
      button.append(label);
    }
    function render() {
      ribbon.innerHTML = '';
      sequence.items.forEach((item, index) => {
        const slot = document.createElement('span');
        slot.className = `pattern-slot ${index < placed.length ? `slot-${placed[index]}` : 'slot-empty'}`;
        if (index < placed.length) slot.append(renderPatternCharacter(placed[index], index === placed.length - 1 ? 'happy' : 'calm'));
        slot.setAttribute('aria-label', index < placed.length ? placed[index] : 'empty pattern slot');
        ribbon.append(slot);
      });
      document.querySelectorAll('.pattern-choice').forEach(renderChoiceButton);
    }
    function reset() {
      placed = ['sun', 'moon'];
      sequence.reset();
      sequence.index = placed.length;
      status.textContent = 'Choose what comes next.';
      render();
    }
    function choose(value) {
      const expected = sequence.items[placed.length];
      if (!expected) {
        status.textContent = 'Pattern complete.';
        return;
      }
      if (value === expected) {
        placed.push(value);
        sequence.index = placed.length;
        status.textContent = placed.length === sequence.items.length ? 'Pattern complete.' : 'That fits.';
        render();
      } else {
        status.textContent = 'Try the other shape.';
      }
    }
    choiceHost.addEventListener('click', (event) => {
      const choice = event.target.closest('.pattern-choice');
      if (choice) choose(choice.dataset.value);
    });
    document.querySelector('#next').addEventListener('click', () => choose(sequence.items[placed.length]));
    document.querySelector('#reset').addEventListener('click', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [], reset, gameId: 'pattern-builder-v2' });
    reset();
    window.__patternBuilderProofState = () => ({ placed: [...placed], next: sequence.items[placed.length] || null, complete: placed.length === sequence.items.length, hasCharacterRenderer: [...document.querySelectorAll('.pattern-choice')].every((choice) => Boolean(choice.querySelector('.procedural-character-svg.character-family-world'))) && [...document.querySelectorAll('.pattern-slot:not(.slot-empty)')].every((slot) => Boolean(slot.querySelector('.procedural-character-svg.character-family-world'))), hasTapAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
