<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Months of the Year</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Months of the Year</strong><span>Move around the year.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene months-world" aria-label="Months of the year play area">
      <div class="month-wheel" id="wheel" aria-label="Month wheel"></div>
      <div class="month-center" id="activeMonth" aria-live="polite">January</div>
      <p class="scene-status" id="status">January begins the year.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="next" type="button">Next month</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const months = [
      ['january', 'January', 'January begins the year.'],
      ['february', 'February', 'February comes after January.'],
      ['march', 'March', 'March starts a new season in many places.'],
      ['april', 'April', 'April keeps the year moving.'],
      ['may', 'May', 'May is month five.'],
      ['june', 'June', 'June is halfway through the year.'],
      ['july', 'July', 'July follows June.'],
      ['august', 'August', 'August is month eight.'],
      ['september', 'September', 'September begins the last four months.'],
      ['october', 'October', 'October follows September.'],
      ['november', 'November', 'November is month eleven.'],
      ['december', 'December', 'December completes the year.']
    ].map(([id, label, cue]) => ({ id, label, cue }));
    const cycle = new LeonSalV2.TimeCycleEngine(months);
    const wheel = document.querySelector('#wheel');
    const activeMonth = document.querySelector('#activeMonth');
    const status = document.querySelector('#status');

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function setMonth(index) {
      const next = Math.max(0, Math.min(months.length - 1, index));
      cycle.set(next);
      update();
    }

    function renderWheel() {
      wheel.innerHTML = '';
      months.forEach((month, index) => {
        const button = document.createElement('button');
        button.className = 'month-dot';
        button.type = 'button';
        button.dataset.month = month.id;
        button.style.setProperty('--month-index', index);
        button.textContent = month.label.slice(0, 3);
        button.setAttribute('aria-label', `Choose ${month.label}`);
        button.addEventListener('click', () => setMonth(index));
        wheel.append(button);
      });
    }

    function calendarRecord() {
      return { id: 'world-calendar', displayName: 'Calendar', family: 'world', registryGroup: 'world' };
    }

    function monthState() {
      if (cycle.sequence.index === 0) return 'calm';
      if (cycle.sequence.index >= months.length - 1) return 'excited';
      if (cycle.sequence.index >= 6) return 'happy';
      return 'calm';
    }

    function renderActiveMonth() {
      const current = cycle.sequence.current();
      const renderer = window.LeonSalCharacterRenderer;
      activeMonth.replaceChildren();
      if (renderer) {
        activeMonth.append(renderer.makeCharacter(calendarRecord(), monthState(), { decorative: false }));
      }
      const label = document.createElement('span');
      label.className = 'time-cycle-label';
      label.textContent = current.label;
      activeMonth.append(label);
    }

    function update() {
      const current = cycle.sequence.current();
      renderActiveMonth();
      activeMonth.dataset.month = current.id;
      status.textContent = current.cue;
      document.querySelectorAll('.month-dot').forEach((button, index) => {
        button.dataset.active = String(index === cycle.sequence.index);
        button.dataset.past = String(index < cycle.sequence.index);
      });
      wheel.style.setProperty('--active-month', cycle.sequence.index);
    }

    function reset() {
      setMonth(0);
    }

    document.querySelector('#next').addEventListener('click', () => setMonth((cycle.sequence.index + 1) % months.length));
    document.querySelector('#reset').addEventListener('click', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [], reset, gameId: 'months-year-v2' });
    renderWheel();
    reset();
    window.__monthsYearProofState = () => ({
      month: cycle.sequence.current().label,
      index: cycle.sequence.index,
      count: months.length,
      hasCharacterRenderer: Boolean(activeMonth.querySelector('.procedural-character-svg.character-family-world')),
      hasTapAlternative: true,
      calmMode: settings.value.calmMode,
      reducedMotion: settings.value.reducedMotion || !settings.allowsMotion()
    });
  </script>
</body>
</html>
