<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double-Decker Bus Journey</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Double-Decker Bus Journey</strong><span>Choose a bus and speed.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene bus-world" id="world" data-bus="uk" data-speed="medium" aria-label="Double-decker bus play area">
      <div class="bus-skyline" aria-hidden="true">
        <span class="bus-cloud bus-cloud-a"></span>
        <span class="bus-cloud bus-cloud-b"></span>
        <span class="bus-sun"></span>
        <span class="bus-city bus-city-a"></span>
        <span class="bus-city bus-city-b"></span>
        <span class="bus-stop start-stop"></span>
        <span class="bus-landmark bus-landmark-park" data-landmark="park">Park</span>
        <span class="bus-landmark bus-landmark-library" data-landmark="library">Library</span>
        <span class="bus-stop finish-stop"></span>
        <span class="bus-road"></span>
        <span class="bus-lights" id="busLights"></span>
        <span class="speed-ribbon" id="speedRibbon">
          <i data-speed-dot="super-slow"></i><i data-speed-dot="slow"></i><i data-speed-dot="medium"></i><i data-speed-dot="fast"></i><i data-speed-dot="super-speed"></i>
        </span>
        <span class="double-bus" id="bus" role="button" tabindex="0" aria-label="Start the selected bus journey">
          <span class="bus-destination" id="busDestination">Park</span>
          <span class="bus-route-mark" id="busRouteMark">UK</span>
          <span class="bus-motion-lines"></span>
          <span class="bus-deck top-deck"></span>
          <span class="bus-deck lower-deck"></span>
          <span class="bus-side-stripe"></span>
          <span class="bus-face"></span>
          <span class="bus-wheel front-wheel"></span>
          <span class="bus-wheel back-wheel"></span>
        </span>
      </div>
      <div class="bus-choice-row" id="busChoices">
        <button class="bus-choice" type="button" data-bus="uk">UK Bus</button>
        <button class="bus-choice" type="button" data-bus="hong-kong">Hong Kong Bus</button>
        <button class="bus-choice" type="button" data-bus="night">Night Bus</button>
      </div>
      <div class="bus-speed-row" id="speedChoices" aria-label="Bus speed">
        <button class="bus-speed" type="button" data-speed="super-slow">Super slow</button>
        <button class="bus-speed" type="button" data-speed="slow">Slow</button>
        <button class="bus-speed" type="button" data-speed="medium">Medium</button>
        <button class="bus-speed" type="button" data-speed="fast">Fast</button>
        <button class="bus-speed" type="button" data-speed="super-speed">Super speed</button>
      </div>
      <p class="scene-status" id="status">Choose a bus pace. Stop anytime.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="go" type="button">Go</button>
        <button class="scene-button" id="pauseBus" type="button">Stop bus</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const causeEffect = new LeonSalV2.CauseEffectEngine();
    const world = document.querySelector('#world');
    const bus = document.querySelector('#bus');
    const destination = document.querySelector('#busDestination');
    const routeMark = document.querySelector('#busRouteMark');
    const status = document.querySelector('#status');
    const speedFactors = {
      'super-slow': 10,
      slow: 18,
      medium: 30,
      fast: 48,
      'super-speed': 70
    };
    const speedLabels = {
      'super-slow': 'super slow',
      slow: 'slow',
      medium: 'medium',
      fast: 'fast',
      'super-speed': 'super speed'
    };
    const busLabels = {
      uk: 'UK Bus',
      'hong-kong': 'Hong Kong Bus',
      night: 'Night Bus'
    };
    const busDestinations = {
      uk: 'Park',
      'hong-kong': 'Harbour',
      night: 'Home'
    };
    const busRouteMarks = {
      uk: 'UK',
      'hong-kong': 'HK',
      night: 'Nite'
    };
    let selectedBus = 'uk';
    let selectedSpeed = 'medium';
    let progress = 0;
    let running = false;
    let removeStep = null;
    let lastMilestone = 'start';
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function busRecord(button) {
      const label = busLabels[button.dataset.bus] || button.textContent.trim();
      return { id: `world-bus-${button.dataset.bus}`, displayName: label, family: 'world', registryGroup: 'world' };
    }
    function renderBusChoices() {
      const renderer = window.LeonSalCharacterRenderer;
      document.querySelectorAll('.bus-choice').forEach((button) => {
        const label = busLabels[button.dataset.bus] || button.textContent.trim();
        button.replaceChildren();
        if (renderer) {
          button.append(renderer.makeCharacter(busRecord(button), button.dataset.bus === selectedBus ? 'happy' : 'calm', { decorative: true }));
        }
        const text = document.createElement('span');
        text.className = 'bus-choice-label';
        text.textContent = label;
        button.append(text);
      });
    }
    function effectiveSpeed() {
      if (!settings.allowsMotion()) return 0;
      const base = speedFactors[selectedSpeed] || speedFactors.medium;
      return settings.value.calmMode ? Math.min(base, speedFactors.slow) : base;
    }
    function updateButtons() {
      document.querySelectorAll('.bus-choice').forEach((button) => {
        button.dataset.active = String(button.dataset.bus === selectedBus);
      });
      renderBusChoices();
      document.querySelectorAll('.bus-speed').forEach((button) => {
        button.dataset.active = String(button.dataset.speed === selectedSpeed);
      });
      document.querySelectorAll('[data-speed-dot]').forEach((dot) => {
        dot.dataset.active = String(dot.dataset.speedDot === selectedSpeed);
      });
    }
    function setProgress(value) {
      progress = Math.max(0, Math.min(100, value));
      bus.style.setProperty('--progress', `${progress}%`);
      bus.dataset.moving = String(running && settings.allowsMotion());
      world.dataset.arrived = String(progress >= 100);
      updateJourneyMilestone();
      if (progress >= 100) {
        stopBus();
        status.textContent = `${busName()} arrived gently.`;
      }
    }
    function updateJourneyMilestone() {
      const next = progress >= 100 ? 'finish' : progress >= 58 ? 'library' : progress >= 34 ? 'park' : 'start';
      if (next === lastMilestone) return;
      lastMilestone = next;
      world.dataset.milestone = next;
      document.querySelectorAll('.bus-landmark').forEach((item) => {
        item.dataset.active = String(item.dataset.landmark === next);
      });
      if (!running || next === 'finish') return;
      const label = next === 'park' ? 'passing the park' : next === 'library' ? 'passing the library' : 'starting softly';
      status.textContent = `${busName()} is ${label}.`;
    }
    function busName() {
      return busLabels[selectedBus] || 'UK Bus';
    }
    function setBus(nextBus) {
      selectedBus = nextBus;
      world.dataset.bus = selectedBus;
      if (destination) destination.textContent = busDestinations[selectedBus] || 'Park';
      if (routeMark) routeMark.textContent = busRouteMarks[selectedBus] || 'Bus';
      updateButtons();
      status.textContent = `${busName()} is ready at ${speedLabels[selectedSpeed]} speed.`;
    }
    function setSpeed(nextSpeed) {
      selectedSpeed = nextSpeed;
      if (settings.value.speed !== nextSpeed) settings.set({ speed: nextSpeed });
      updateButtons();
      status.textContent = `${busName()} speed is ${speedLabels[selectedSpeed]}.`;
      world.dataset.speed = selectedSpeed;
    }
    function stopBus() {
      running = false;
      removeStep?.();
      removeStep = null;
      bus.dataset.moving = 'false';
    }
    causeEffect.connect('go-bus', () => {
      stopBus();
      if (!settings.allowsMotion()) {
        setProgress(100);
        return 'arrived-static';
      }
      running = true;
      status.textContent = `${busName()} is rolling at ${speedLabels[selectedSpeed]} speed.`;
      removeStep = motion.add((dt) => setProgress(progress + dt * effectiveSpeed()));
      return 'moving';
    });
    function reset() {
      stopBus();
      setBus('uk');
      setSpeed('medium');
      lastMilestone = 'resetting';
      world.dataset.milestone = 'start';
      document.querySelectorAll('.bus-landmark').forEach((item) => { item.dataset.active = 'false'; });
      setProgress(0);
      status.textContent = 'Choose a bus pace. Stop anytime.';
    }
    document.querySelector('#busChoices').addEventListener('click', (event) => {
      const button = event.target.closest('.bus-choice');
      if (button) setBus(button.dataset.bus);
    });
    document.querySelector('#speedChoices').addEventListener('click', (event) => {
      const button = event.target.closest('.bus-speed');
      if (button) setSpeed(button.dataset.speed);
    });
    document.querySelector('#go').addEventListener('click', () => causeEffect.trigger('go-bus'));
    bus.addEventListener('click', () => causeEffect.trigger('go-bus'));
    bus.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        causeEffect.trigger('go-bus');
      }
    });
    document.querySelector('#pauseBus').addEventListener('click', stopBus);
    document.querySelector('#reset').addEventListener('click', reset);
    settings.on('settings-change', () => {
      if (speedFactors[settings.value.speed] && selectedSpeed !== settings.value.speed) {
        selectedSpeed = settings.value.speed;
        world.dataset.speed = selectedSpeed;
        updateButtons();
      }
      if (!settings.allowsMotion()) stopBus();
      bus.dataset.calm = String(settings.value.calmMode);
    });
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [causeEffect], reset, gameId: 'double-decker-bus-v2' });
    reset();
    window.__doubleDeckerBusProofState = () => ({
      bus: selectedBus,
      speed: selectedSpeed,
      effectiveSpeed: effectiveSpeed(),
      progress,
      running,
      milestone: lastMilestone,
      hasCharacterRenderer: [...document.querySelectorAll('.bus-choice')].every((button) => Boolean(button.querySelector('.procedural-character-svg.character-family-world'))),
      hasTapAlternative: true,
      destination: destination?.textContent || '',
      routeMark: routeMark?.textContent || '',
      calmMode: settings.value.calmMode,
      reducedMotion: settings.value.reducedMotion || !settings.allowsMotion()
    });
  </script>
</body>
</html>
