<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transport Adventure</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Transport Adventure</strong><span>Choose a route.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene transport-world" id="world" data-route="road" aria-label="Transport Adventure play area">
      <div class="transport-landscape" aria-hidden="true">
        <span class="route-line road-line"></span>
        <span class="route-line rail-line"></span>
        <span class="route-line sky-line"></span>
        <span class="route-line water-line"></span>
        <span class="transport-vehicle" id="vehicle"></span>
        <span class="arrival-gate"></span>
      </div>
      <div class="transport-choices" id="choices"></div>
      <p class="scene-status" id="status">Road route is ready.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="go" type="button">Go</button>
        <button class="scene-button" id="next" type="button">Next route</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const causeEffect = new LeonSalV2.CauseEffectEngine();
    const cycle = new LeonSalV2.TimeCycleEngine([
      { id: 'road', label: 'Road', cue: 'Road route is ready.' },
      { id: 'rail', label: 'Rail', cue: 'Rail route is ready.' },
      { id: 'sky', label: 'Sky', cue: 'Sky route is ready.' },
      { id: 'water', label: 'Water', cue: 'Water route is ready.' }
    ]);
    const world = document.querySelector('#world');
    const choices = document.querySelector('#choices');
    const status = document.querySelector('#status');
    const vehicle = document.querySelector('#vehicle');
    let progress = 0;
    let running = false;
    let removeStep = null;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function setRoute(index) {
      cycle.set(index);
      const current = cycle.sequence.items[cycle.sequence.index];
      world.dataset.route = current.id;
      status.textContent = current.cue;
      document.querySelectorAll('.transport-choice').forEach((button, buttonIndex) => {
        button.dataset.active = String(buttonIndex === cycle.sequence.index);
      });
      setProgress(0);
    }
    function setProgress(value) {
      progress = Math.max(0, Math.min(100, value));
      vehicle.style.setProperty('--progress', `${progress}%`);
      if (progress >= 100) status.textContent = `${cycle.sequence.current().label} route arrived.`;
    }
    function stopRun() {
      running = false;
      removeStep?.();
      removeStep = null;
    }
    causeEffect.connect('go-route', () => {
      stopRun();
      running = true;
      if (!settings.allowsMotion()) {
        setProgress(100);
        running = false;
        return 'arrived';
      }
      status.textContent = `${cycle.sequence.current().label} route moving.`;
      removeStep = motion.add((dt) => {
        setProgress(progress + dt * (settings.value.calmMode ? 34 : 48));
        if (progress >= 100) stopRun();
      });
      return 'moving';
    });
    function renderChoices() {
      choices.innerHTML = '';
      cycle.sequence.items.forEach((route, index) => {
        const button = document.createElement('button');
        button.className = `transport-choice ${route.id}`;
        button.type = 'button';
        button.dataset.route = route.id;
        button.textContent = route.label;
        button.setAttribute('aria-label', `Choose ${route.label}`);
        button.addEventListener('click', () => setRoute(index));
        choices.append(button);
      });
    }
    function reset() {
      stopRun();
      setRoute(0);
    }
    document.querySelector('#go').addEventListener('click', () => causeEffect.trigger('go-route'));
    document.querySelector('#next').addEventListener('click', () => setRoute((cycle.sequence.index + 1) % cycle.sequence.items.length));
    document.querySelector('#reset').addEventListener('click', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [causeEffect], reset, gameId: 'transport-adventure-v2' });
    renderChoices();
    reset();
    window.__transportAdventureProofState = () => ({
      route: cycle.sequence.current().label,
      progress,
      running,
      hasTapAlternative: true,
      calmMode: settings.value.calmMode,
      reducedMotion: settings.value.reducedMotion || !settings.allowsMotion()
    });
  </script>
</body>
</html>
