<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sort It</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Sort It</strong><span>Put each object with its group.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene sort-it-world" aria-label="Sorting play area">
      <p class="scene-status" id="status">Pick something to sort.</p>
      <div class="sort-baskets" id="baskets">
        <button class="sort-basket" type="button" data-category="sky">Sky</button>
        <button class="sort-basket" type="button" data-category="garden">Garden</button>
      </div>
      <div class="sort-items" id="items"></div>
      <div class="drawer-controls">
        <button class="scene-button" id="hint" type="button">Hint</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const matcher = new LeonSalV2.SortMatchEngine();
    const dragDrop = new LeonSalV2.DragDropEngine({ snapDistance: 90 });
    const status = document.querySelector('#status');
    const itemWrap = document.querySelector('#items');
    const baskets = document.querySelector('#baskets');
    const objects = [
      { id: 'cloud', label: 'Cloud', category: 'sky', icon: 'cloud' },
      { id: 'star', label: 'Star', category: 'sky', icon: 'star' },
      { id: 'flower', label: 'Flower', category: 'garden', icon: 'flower' },
      { id: 'leaf', label: 'Leaf', category: 'garden', icon: 'leaf' }
    ];
    let selected = null;
    let sorted = new Set();
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function build() {
      selected = null;
      sorted = new Set();
      itemWrap.innerHTML = '';
      objects.forEach((object) => {
        matcher.register(object.id, object.category);
        const item = document.createElement('button');
        item.className = `sort-item ${object.icon}`;
        item.type = 'button';
        item.dataset.id = object.id;
        item.dataset.category = object.category;
        item.textContent = object.label;
        item.setAttribute('aria-label', object.label);
        itemWrap.append(item);
        const zone = document.querySelector(`.sort-basket[data-category="${object.category}"]`);
        dragDrop.register(item, zone, { select: () => selectItem(item), drop: () => tryBasket(zone) });
      });
      document.querySelectorAll('.sort-basket').forEach((basket) => basket.dataset.count = '0');
      status.textContent = 'Pick something to sort.';
    }
    function selectItem(item) {
      if (sorted.has(item.dataset.id)) return;
      selected = item;
      document.querySelectorAll('.sort-item').forEach((node) => node.dataset.selected = String(node === item));
      status.textContent = `${item.textContent} selected. Choose a group.`;
    }
    function tryBasket(basket) {
      if (!selected) {
        status.textContent = 'Pick something first.';
        return;
      }
      if (matcher.check(selected.dataset.id, basket.dataset.category)) {
        sorted.add(selected.dataset.id);
        selected.dataset.sorted = 'true';
        basket.dataset.count = String(Number(basket.dataset.count || 0) + 1);
        selected = null;
        status.textContent = sorted.size === objects.length ? 'Everything is sorted.' : 'Sorted.';
      } else {
        status.textContent = 'Try the other group.';
      }
      document.querySelectorAll('.sort-item').forEach((node) => node.dataset.selected = 'false');
    }
    itemWrap.addEventListener('click', (event) => {
      const item = event.target.closest('.sort-item');
      if (item) selectItem(item);
    });
    baskets.addEventListener('click', (event) => {
      const basket = event.target.closest('.sort-basket');
      if (basket) tryBasket(basket);
    });
    document.querySelector('#hint').addEventListener('click', () => {
      const next = objects.find((object) => !sorted.has(object.id));
      status.textContent = next ? `${next.label} goes with ${next.category}.` : 'Everything is sorted.';
    });
    document.querySelector('#reset').addEventListener('click', build);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [], reset: build, gameId: 'sort-it-v2' });
    build();
    window.__sortItProofState = () => ({ selected: selected?.dataset.id || null, sorted: [...sorted], complete: sorted.size === objects.length, hasTapAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
