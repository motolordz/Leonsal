<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Pals</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Planet Pals</strong><span>Visit planets in a gentle orbit.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene planet-pals-world" aria-label="Planet pals play area">
      <div class="planet-pals-sun" aria-hidden="true"></div>
      <div class="planet-pals-orbit orbit-one" aria-hidden="true"></div>
      <div class="planet-pals-orbit orbit-two" aria-hidden="true"></div>
      <div class="planet-pals-orbit orbit-three" aria-hidden="true"></div>
      <button class="planet-pal mercury" type="button" data-planet="Mercury">Mercury</button>
      <button class="planet-pal earth" type="button" data-planet="Earth">Earth</button>
      <button class="planet-pal mars" type="button" data-planet="Mars">Mars</button>
      <button class="planet-pal saturn" type="button" data-planet="Saturn">Saturn</button>
      <p class="scene-status" id="status">Tap a planet to visit.</p>
      <p class="scale-note">Simple learning layout, not physical scale.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="next" type="button">Next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const orbit = new LeonSalV2.OrbitEngine(motion, settings);
    const sequence = new LeonSalV2.SequenceEngine(['Mercury', 'Earth', 'Mars', 'Saturn']);
    const status = document.querySelector('#status');
    const planetButtons = [...document.querySelectorAll('.planet-pal')];
    let visited = [];
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function planetRecord(name) {
      return { id: `planet-${name.toLowerCase()}`, displayName: name, family: 'planet', registryGroup: 'planets' };
    }
    function renderPlanetButtons() {
      const renderer = window.LeonSalCharacterRenderer;
      planetButtons.forEach((button) => {
        const name = button.dataset.planet;
        const active = button.dataset.active === 'true';
        button.replaceChildren();
        if (renderer) {
          button.append(renderer.makeCharacter(planetRecord(name), active ? 'excited' : 'calm', { decorative: false }));
        } else {
          button.textContent = name;
        }
        button.setAttribute('aria-label', `Visit ${name}`);
      });
    }
    function setupOrbit() {
      orbit.destroy();
      const rect = document.querySelector('.planet-pals-world').getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height * .47;
      const maxRadius = Math.min(rect.width * .36, rect.height * .24);
      const radii = [maxRadius * .45, maxRadius * .65, maxRadius * .82, maxRadius];
      planetButtons.forEach((button, index) => {
        orbit.add({
          element: button,
          cx,
          cy,
          radius: radii[index],
          angle: index * Math.PI * .5,
          speed: (.15 + index * .025) * (settings.value.calmMode ? .35 : 1),
          update: (item) => {
            item.element.style.transform = `translate(${item.x}px, ${item.y}px) translate(-50%, -50%)`;
          }
        });
      });
    }
    function visit(name) {
      if (!visited.includes(name)) visited.push(name);
      planetButtons.forEach((button) => button.dataset.active = String(button.dataset.planet === name));
      status.textContent = `Visiting ${name}.`;
      if (visited.length === planetButtons.length) status.textContent = 'All planet pals visited.';
      renderPlanetButtons();
    }
    function reset() {
      visited = [];
      sequence.reset();
      planetButtons.forEach((button) => button.dataset.active = 'false');
      status.textContent = 'Tap a planet to visit.';
      renderPlanetButtons();
      setupOrbit();
    }
    planetButtons.forEach((button) => button.addEventListener('click', () => visit(button.dataset.planet)));
    document.querySelector('#next').addEventListener('click', () => {
      const name = sequence.current();
      visit(name);
      sequence.next();
    });
    document.querySelector('#reset').addEventListener('click', reset);
    settings.on('change', () => setupOrbit());
    window.addEventListener('resize', setupOrbit);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [orbit], reset, gameId: 'planet-pals-v2' });
    reset();
    window.__planetPalsProofState = () => ({ visited: [...visited], active: planetButtons.find((button) => button.dataset.active === 'true')?.dataset.planet || null, planetCount: planetButtons.length, hasCharacterRenderer: planetButtons.every((button) => Boolean(button.querySelector('.procedural-character-svg.character-family-planet'))), educationalScaleNote: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
