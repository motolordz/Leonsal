<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Tracing</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Number Tracing</strong><span>Follow the soft number path.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene number-trace-world" aria-label="Number tracing play area">
      <div class="trace-letter-ghost trace-number-ghost" aria-hidden="true" id="ghostNumber">1</div>
      <canvas id="numberTraceCanvas" class="trace-canvas" aria-label="Trace number 1. Drag along the path, or use the Step button."></canvas>
      <p class="scene-status" id="status">Trace number 1.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="step" type="button">Step</button>
        <button class="scene-button" id="next" type="button">Next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const canvas = document.querySelector('#numberTraceCanvas');
    const status = document.querySelector('#status');
    const ghost = document.querySelector('#ghostNumber');
    const characterPreview = document.createElement('div');
    characterPreview.className = 'trace-character-preview';
    characterPreview.setAttribute('aria-live', 'polite');
    document.querySelector('.number-trace-world').append(characterPreview);
    const numbers = ['1', '2', '3', '5', '10'];
    let numberIndex = 0;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function currentNumber() { return numbers[numberIndex]; }
    function currentState() {
      const ratio = trace.path.length ? trace.progress / trace.path.length : 0;
      if (ratio >= .92) return 'excited';
      if (ratio >= .65) return 'happy';
      if (ratio >= .38) return 'calm';
      if (ratio > 0) return 'low';
      return 'empty';
    }
    function numberRecord() {
      const number = currentNumber();
      return { id: `number-${number}`, displayName: `Number ${number}`, family: 'number' };
    }
    function renderCharacter() {
      characterPreview.replaceChildren();
      const renderer = window.LeonSalCharacterRenderer;
      if (!renderer) {
        characterPreview.textContent = currentNumber();
        return;
      }
      characterPreview.append(renderer.makeCharacter(numberRecord(), currentState(), { decorative: false }));
    }
    function makePath() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const number = currentNumber();
      const points = [];
      const pushLine = (a, b, steps = 24) => {
        for (let i = 0; i <= steps; i += 1) points.push({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps });
      };
      const pushArc = (cx, cy, rx, ry, start, end, steps = 32) => {
        for (let i = 0; i <= steps; i += 1) {
          const t = start + (end - start) * i / steps;
          points.push({ x: cx + Math.cos(t) * rx, y: cy + Math.sin(t) * ry });
        }
      };
      if (number === '1') {
        pushLine({ x: w * .39, y: h * .33 }, { x: w * .5, y: h * .24 }, 12);
        pushLine({ x: w * .5, y: h * .24 }, { x: w * .5, y: h * .72 }, 38);
        pushLine({ x: w * .5, y: h * .72 }, { x: w * .61, y: h * .72 }, 8);
      } else if (number === '2') {
        pushArc(w * .5, h * .35, w * .22, h * .13, Math.PI * 1.05, Math.PI * 2.05, 32);
        pushLine({ x: w * .66, y: h * .41 }, { x: w * .34, y: h * .72 }, 30);
        pushLine({ x: w * .34, y: h * .72 }, { x: w * .68, y: h * .72 }, 18);
      } else if (number === '3') {
        pushArc(w * .48, h * .37, w * .2, h * .12, Math.PI * 1.2, Math.PI * 2.45, 32);
        pushArc(w * .48, h * .59, w * .22, h * .14, Math.PI * 1.55, Math.PI * 2.75, 34);
      } else if (number === '5') {
        pushLine({ x: w * .66, y: h * .25 }, { x: w * .36, y: h * .25 }, 18);
        pushLine({ x: w * .36, y: h * .25 }, { x: w * .33, y: h * .48 }, 16);
        pushArc(w * .5, h * .58, w * .21, h * .15, Math.PI * 1.1, Math.PI * 2.65, 38);
      } else {
        pushLine({ x: w * .34, y: h * .25 }, { x: w * .34, y: h * .72 }, 34);
        pushLine({ x: w * .25, y: h * .34 }, { x: w * .34, y: h * .25 }, 10);
        pushArc(w * .6, h * .5, w * .18, h * .25, -Math.PI * .5, Math.PI * 1.5, 56);
      }
      return points;
    }
    const trace = new LeonSalV2.TraceEngine(canvas, motion, settings, { path: [], tolerance: 34 });
    function reset() {
      ghost.textContent = currentNumber();
      trace.setPath(makePath());
      status.textContent = `Trace number ${currentNumber()}.`;
      renderCharacter();
    }
    function add(x, y) {
      const rect = canvas.getBoundingClientRect();
      const result = trace.addPoint(x - rect.left, y - rect.top);
      status.textContent = result.complete ? `${currentNumber()} complete.` : result.near ? 'Keep tracing.' : 'Come back to the glow.';
      renderCharacter();
    }
    new LeonSalV2.InputEngine(canvas).onPointer({ down: ({ x, y }) => add(x, y), move: ({ x, y }) => add(x, y) });
    document.querySelector('#step').addEventListener('click', () => {
      const point = trace.path[Math.min(trace.progress, trace.path.length - 1)];
      if (point) add(point.x + canvas.getBoundingClientRect().left, point.y + canvas.getBoundingClientRect().top);
    });
    document.querySelector('#next').addEventListener('click', () => { numberIndex = (numberIndex + 1) % numbers.length; reset(); });
    document.querySelector('#reset').addEventListener('click', reset);
    window.addEventListener('resize', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [trace], reset, gameId: 'number-tracing-v2' });
    reset();
    window.__numberTracingProofState = () => ({ number: currentNumber(), progress: trace.progress, complete: trace.progress >= trace.path.length, pathLength: trace.path.length, characterState: currentState(), hasCharacterRenderer: Boolean(characterPreview.querySelector('.procedural-character-svg')), hasStepAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
