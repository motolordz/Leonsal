<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shape Builder</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Shape Builder</strong><span>Place shapes to make a simple picture.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>

    <section class="game-scene shape-world" aria-label="Shape builder play area">
      <div class="shape-picture" id="picture" aria-label="Build picture target">
        <div class="shape-target target-body" data-target="body"></div>
        <div class="shape-target target-roof" data-target="roof"></div>
        <div class="shape-target target-door" data-target="door"></div>
        <div class="shape-target target-sun" data-target="sun"></div>
      </div>
      <div class="shape-helper" id="shapeHelper" aria-live="polite"></div>
      <div class="shape-tray" id="tray" aria-label="Choose a shape">
        <button class="shape-piece piece-body" type="button" data-piece="body" aria-label="Place square body"></button>
        <button class="shape-piece piece-roof" type="button" data-piece="roof" aria-label="Place triangle roof"></button>
        <button class="shape-piece piece-door" type="button" data-piece="door" aria-label="Place rectangle door"></button>
        <button class="shape-piece piece-sun" type="button" data-piece="sun" aria-label="Place circle sun"></button>
      </div>
      <p class="scene-status" id="status">Choose a shape.</p>
      <div class="drawer-controls">
        <button id="placeNext" class="scene-button" type="button">Place</button>
        <button id="reset" class="scene-button" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const engine = new LeonSalV2.BuildAssemblyEngine([
      { id: 'body', x: 50, y: 58, tolerance: 120 },
      { id: 'roof', x: 50, y: 27, tolerance: 120 },
      { id: 'door', x: 50, y: 72, tolerance: 120 },
      { id: 'sun', x: 80, y: 22, tolerance: 120 }
    ]);
    const status = document.querySelector('#status');
    const picture = document.querySelector('#picture');
    const shapeHelper = document.querySelector('#shapeHelper');
    const order = ['body', 'roof', 'door', 'sun'];
    let selected = null;
    let pulse = 0;

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function helperRecord() {
      return { id: 'world-puzzle', displayName: 'Shape Helper', family: 'world', registryGroup: 'world' };
    }

    function helperState() {
      if (engine.complete()) return 'excited';
      if (engine.placed.size >= 2) return 'happy';
      if (engine.placed.size >= 1) return 'calm';
      return 'low';
    }

    function renderHelper() {
      const renderer = window.LeonSalCharacterRenderer;
      shapeHelper.replaceChildren();
      if (renderer) {
        shapeHelper.append(renderer.makeCharacter(helperRecord(), helperState(), { decorative: false }));
      }
      const label = document.createElement('span');
      label.className = 'shape-helper-label';
      label.textContent = engine.complete() ? 'Built' : 'Shapes';
      shapeHelper.append(label);
    }

    function select(piece) {
      selected = piece;
      document.querySelectorAll('.shape-piece').forEach((item) => item.dataset.selected = String(item.dataset.piece === piece));
      status.textContent = `Place the ${piece}.`;
      audio.tone('tap');
    }

    function place(piece = selected || order.find((id) => !engine.placed.has(id))) {
      if (!piece || engine.placed.has(piece)) return;
      const target = engine.snap(piece, 50, 50);
      if (!target) return;
      document.querySelector(`[data-target="${piece}"]`).dataset.placed = 'true';
      document.querySelector(`[data-piece="${piece}"]`).dataset.placed = 'true';
      selected = null;
      pulse = settings.value.calmMode ? 0.35 : 0.8;
      audio.tone(engine.complete() ? 'success' : 'tap');
      status.textContent = engine.complete() ? 'Picture complete.' : 'Choose another shape.';
      renderHelper();
    }

    function reset() {
      engine.placed.clear();
      selected = null;
      pulse = 0;
      document.querySelectorAll('.shape-piece,.shape-target').forEach((item) => {
        item.dataset.selected = 'false';
        item.dataset.placed = 'false';
      });
      status.textContent = 'Choose a shape.';
      renderHelper();
    }

    function animate(dt) {
      if (!settings.allowsMotion()) {
        picture.style.transform = 'none';
        return;
      }
      pulse = Math.max(0, pulse - dt * settings.speedFactor());
      picture.style.transform = `scale(${1 + Math.sin(pulse * Math.PI * 3) * 0.025 * pulse})`;
    }

    document.querySelectorAll('.shape-piece').forEach((button) => {
      button.addEventListener('click', () => {
        const piece = button.dataset.piece;
        if (engine.placed.has(piece)) return;
        select(piece);
        place(piece);
      });
    });
    document.querySelector('#placeNext').addEventListener('click', () => place());
    document.querySelector('#reset').addEventListener('click', reset);
    const removeTick = motion.add(animate);
    reset();
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [audio], resources: [{ destroy: removeTick }, engine], reset, gameId: 'shape-builder-v2' });
    window.__shapeBuilderProofState = () => ({ placed: [...engine.placed], complete: engine.complete(), selected, hasCharacterRenderer: Boolean(shapeHelper.querySelector('.procedural-character-svg.character-family-world')), motion: settings.allowsMotion(), calmMode: settings.value.calmMode });
  </script>
</body>
</html>
