<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Shower</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Star Shower</strong><span>Touch the sky for soft stars.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>

    <section class="game-scene star-world" aria-label="Star shower play area">
      <canvas class="star-canvas" id="starCanvas" aria-label="Star shower. Tap, click, or press the sky to make a soft star fall."></canvas>
      <div class="star-horizon" aria-hidden="true"></div>
      <div class="ambient-character star-helper" id="starHelper" aria-hidden="true"></div>
      <p class="scene-status" id="status">Stars are resting.</p>
      <div class="drawer-controls">
        <button id="makeStar" class="scene-button" type="button">Soft star</button>
        <button id="reset" class="scene-button" type="button">Reset</button>
        <button class="mode-pill" data-stars="few" type="button" aria-pressed="true">Few</button>
        <button class="mode-pill" data-stars="gentle" type="button">Gentle</button>
      </div>
    </section>
  </main>

  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const canvas = document.querySelector('#starCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.querySelector('#status');
    const starHelper = document.querySelector('#starHelper');
    let mode = 'few';
    let stars = [];
    let backgroundStars = [];

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function renderHelper(state = 'calm') {
      const renderer = window.LeonSalCharacterRenderer;
      starHelper.replaceChildren();
      if (renderer) starHelper.append(renderer.makeCharacter({ id: 'world-star', displayName: 'Star', family: 'world', registryGroup: 'world' }, state, { decorative: true }));
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * scale));
      canvas.height = Math.max(1, Math.round(rect.height * scale));
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      backgroundStars = Array.from({ length: settings.value.calmMode ? 18 : 34 }, (_, index) => ({
        x: (index * 73) % Math.max(1, rect.width),
        y: 24 + ((index * 47) % Math.max(1, rect.height * 0.56)),
        r: 1.1 + (index % 3) * 0.45,
        alpha: 0.2 + (index % 5) * 0.08
      }));
      draw(0);
    }

    function maxActiveStars() {
      if (settings.value.calmMode) return 5;
      if (settings.value.particles === 'off') return 3;
      return mode === 'gentle' ? settings.particleCount(12) : settings.particleCount(7);
    }

    function addStar(x, y) {
      const rect = canvas.getBoundingClientRect();
      const cap = Math.max(1, maxActiveStars());
      while (stars.length >= cap) stars.shift();
      stars.push({
        x: x ?? rect.width * (0.25 + Math.random() * 0.5),
        y: y ?? rect.height * 0.22,
        vx: -22 + Math.random() * 44,
        vy: 42 + Math.random() * 28,
        age: 0,
        life: settings.allowsMotion() ? 1.6 : 0.75,
        size: 14 + Math.random() * 12
      });
      status.textContent = 'Soft star.';
      audio.tone('tap');
      renderHelper('happy');
    }

    function drawStar(x, y, size, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffe875';
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 10; i += 1) {
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const radius = i % 2 ? size * 0.42 : size;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function draw(dt) {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      const sky = ctx.createLinearGradient(0, 0, 0, rect.height);
      sky.addColorStop(0, '#14234f');
      sky.addColorStop(0.52, '#31528d');
      sky.addColorStop(1, '#8069ba');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, rect.width, rect.height);
      for (const dot of backgroundStars) {
        ctx.globalAlpha = dot.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      stars = stars.filter(star => star.age < star.life);
      for (const star of stars) {
        if (settings.allowsMotion()) {
          star.age += dt;
          star.x += star.vx * settings.speedFactor() * dt;
          star.y += star.vy * settings.speedFactor() * dt;
          star.vy += 14 * dt;
        } else {
          star.age = Math.min(star.life, star.age + dt * 0.5);
        }
        const alpha = Math.max(0, 1 - (star.age / star.life));
        const glow = ctx.createRadialGradient(star.x, star.y, 1, star.x, star.y, star.size * 3.2);
        glow.addColorStop(0, `rgba(255,232,117,${0.42 * alpha})`);
        glow.addColorStop(1, 'rgba(255,232,117,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size * 3.2, 0, Math.PI * 2);
        ctx.fill();
        drawStar(star.x, star.y, star.size, alpha);
      }
      if (!stars.length) status.textContent = 'Stars are resting.';
    }

    const removeTick = motion.add((dt) => draw(dt));
    new LeonSalV2.InputEngine(canvas).onPointer({
      down: ({ x, y }) => {
        const rect = canvas.getBoundingClientRect();
        addStar(x - rect.left, y - rect.top);
      }
    });
    document.querySelector('#makeStar').addEventListener('click', () => addStar());
    document.querySelector('#reset').addEventListener('click', () => { stars = []; status.textContent = 'Stars are resting.'; draw(0); renderHelper(); });
    document.querySelectorAll('[data-stars]').forEach((button) => button.addEventListener('click', () => {
      mode = button.dataset.stars;
      document.querySelectorAll('[data-stars]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      stars = [];
      draw(0);
    }));
    settings.on('settings-change', resize);
    window.addEventListener('resize', resize);
    resize();
    renderHelper();
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [audio], resources: [{ destroy: removeTick }], reset: () => { stars = []; draw(0); renderHelper(); }, gameId: 'star-shower' });
    window.__starShowerProofState = () => ({ mode, stars: stars.length, maxStars: maxActiveStars(), hasCharacterRenderer: Boolean(starHelper.querySelector('.procedural-character-svg.character-family-world')), calmMode: settings.value.calmMode, motion: settings.allowsMotion() });
  </script>
</body>
</html>
