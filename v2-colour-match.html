<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colour Match</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Colour Match</strong><span>Match paint drops to calm colour wells.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene colour-match-world" aria-label="Colour matching play area">
      <p class="scene-status" id="status">Pick a colour drop.</p>
      <div class="colour-wells" id="wells" aria-label="Colour wells"></div>
      <div class="colour-drops" id="drops" aria-label="Colour drops"></div>
      <div class="drawer-controls">
        <button class="scene-button" id="hint" type="button">Hint</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const matcher = new LeonSalV2.SortMatchEngine();
    const dragDrop = new LeonSalV2.DragDropEngine({ snapDistance: 80 });
    const status = document.querySelector('#status');
    const wells = document.querySelector('#wells');
    const drops = document.querySelector('#drops');
    const colours = [
      { id: 'red', label: 'Red', value: '#f87171', characterId: 'world-paintbrush', displayName: 'Paintbrush' },
      { id: 'blue', label: 'Blue', value: '#38bdf8', characterId: 'world-water', displayName: 'Water Drop' },
      { id: 'yellow', label: 'Yellow', value: '#fde047', characterId: 'world-sun', displayName: 'Sun' },
      { id: 'green', label: 'Green', value: '#4ade80', characterId: 'world-tree', displayName: 'Tree' }
    ];
    let selected = null;
    let matched = new Set();
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function colourRecord(colour) {
      return { id: colour.characterId, displayName: colour.displayName, family: 'world', registryGroup: 'world' };
    }
    function renderDrop(drop, colour, state) {
      const renderer = window.LeonSalCharacterRenderer;
      drop.replaceChildren();
      if (renderer) drop.append(renderer.makeCharacter(colourRecord(colour), state, { decorative: false }));
      else drop.textContent = colour.label;
      const label = document.createElement('span');
      label.className = 'choice-label';
      label.textContent = colour.label;
      drop.append(label);
    }
    function build() {
      selected = null;
      matched = new Set();
      wells.innerHTML = '';
      drops.innerHTML = '';
      for (const colour of colours) {
        matcher.register(colour.id, colour.id);
        const well = document.createElement('button');
        well.className = 'colour-well';
        well.type = 'button';
        well.dataset.colour = colour.id;
        well.style.setProperty('--match-colour', colour.value);
        well.setAttribute('aria-label', `${colour.label} well`);
        well.append(document.createTextNode(colour.label));
        wells.append(well);
        const drop = document.createElement('button');
        drop.className = 'colour-drop';
        drop.type = 'button';
        drop.dataset.colour = colour.id;
        drop.style.setProperty('--match-colour', colour.value);
        drop.setAttribute('aria-label', `${colour.label} paint drop`);
        renderDrop(drop, colour, 'calm');
        drops.append(drop);
        dragDrop.register(drop, well, { select: () => selectDrop(drop), drop: () => tryDrop(well) });
      }
      status.textContent = 'Pick a colour drop.';
    }
    function selectDrop(drop) {
      if (matched.has(drop.dataset.colour)) return;
      selected = drop;
      document.querySelectorAll('.colour-drop').forEach((item) => item.dataset.selected = String(item === drop));
      status.textContent = `${drop.getAttribute('aria-label')} selected. Choose the matching well.`;
    }
    function tryDrop(well) {
      if (!selected) {
        status.textContent = 'Pick a colour drop first.';
        return;
      }
      const itemId = selected.dataset.colour;
      const categoryId = well.dataset.colour;
      if (matcher.check(itemId, categoryId)) {
        matched.add(itemId);
        selected.dataset.matched = 'true';
        const colour = colours.find((candidate) => candidate.id === itemId);
        if (colour) renderDrop(selected, colour, 'excited');
        well.dataset.matched = 'true';
        selected = null;
        status.textContent = matched.size === colours.length ? 'All colours matched.' : 'Match made.';
      } else {
        status.textContent = 'Try the same colour well.';
      }
      document.querySelectorAll('.colour-drop').forEach((item) => item.dataset.selected = 'false');
    }
    wells.addEventListener('click', (event) => {
      const well = event.target.closest('.colour-well');
      if (well) tryDrop(well);
    });
    drops.addEventListener('click', (event) => {
      const drop = event.target.closest('.colour-drop');
      if (drop) selectDrop(drop);
    });
    document.querySelector('#hint').addEventListener('click', () => {
      const next = colours.find((colour) => !matched.has(colour.id));
      status.textContent = next ? `Look for ${next.label}.` : 'All colours matched.';
    });
    document.querySelector('#reset').addEventListener('click', build);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [], reset: build, gameId: 'colour-match-v2' });
    build();
    window.__colourMatchProofState = () => ({ selected: selected?.dataset.colour || null, matched: [...matched], complete: matched.size === colours.length, hasCharacterRenderer: [...document.querySelectorAll('.colour-drop')].every((drop) => Boolean(drop.querySelector('.procedural-character-svg.character-family-world'))), hasTapAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
