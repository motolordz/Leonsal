<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growing Garden</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Growing Garden</strong><span>Touch the soil and help gentle flowers grow.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>

    <section class="game-scene garden-world" aria-label="Growing garden play area">
      <canvas class="garden-canvas" id="gardenCanvas" aria-label="Growing garden. Tap, click, or press the garden to water a seed and watch it grow."></canvas>
      <div class="garden-sun" aria-hidden="true"></div>
      <div class="ambient-character garden-helper" id="gardenHelper" aria-hidden="true"></div>
      <p class="scene-status" id="status">Seeds are resting.</p>
      <div class="drawer-controls">
        <button id="waterOne" class="scene-button" type="button">Water</button>
        <button id="bloomAll" class="scene-button" type="button">Bloom</button>
        <button id="reset" class="scene-button" type="button">Reset</button>
        <button class="mode-pill" data-garden="few" type="button" aria-pressed="true">Few</button>
        <button class="mode-pill" data-garden="many" type="button">Many</button>
      </div>
    </section>
  </main>

  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const canvas = document.querySelector('#gardenCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.querySelector('#status');
    const gardenHelper = document.querySelector('#gardenHelper');
    let mode = 'few';
    let plants = [];
    let drops = [];
    let sparkles = [];
    let time = 0;

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function helperState() {
      const grown = plants.filter((plant) => plant.target > 0).length;
      if (plants.length && plants.every((plant) => plant.target >= 1)) return 'excited';
      if (grown >= 2) return 'happy';
      if (grown >= 1) return 'calm';
      return 'low';
    }

    function renderHelper() {
      const renderer = window.LeonSalCharacterRenderer;
      gardenHelper.replaceChildren();
      if (renderer) gardenHelper.append(renderer.makeCharacter({ id: 'world-tree', displayName: 'Tree', family: 'world', registryGroup: 'world' }, helperState(), { decorative: true }));
    }

    function plantCount() {
      if (settings.value.calmMode) return 3;
      return mode === 'many' ? settings.particleCount(7) : settings.particleCount(4);
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const scale = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * scale));
      canvas.height = Math.max(1, Math.round(rect.height * scale));
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      resetPlants();
    }

    function resetPlants() {
      const rect = canvas.getBoundingClientRect();
      const count = plantCount();
      plants = Array.from({ length: count }, (_, index) => {
        const spread = rect.width * 0.72;
        const base = rect.width * 0.14;
        return {
          x: base + (count === 1 ? spread * 0.5 : (spread * index) / (count - 1)),
          y: rect.height * (0.72 + ((index % 2) * 0.045)),
          growth: 0,
          target: 0,
          hue: 330 + (index * 37) % 80,
          wobble: index * 1.7
        };
      });
      drops = [];
      sparkles = [];
      status.textContent = 'Seeds are resting.';
      draw(0);
      renderHelper();
    }

    function nearestPlant(x) {
      return plants.reduce((best, plant) => {
        const distance = Math.abs(plant.x - x);
        return !best || distance < best.distance ? { plant, distance } : best;
      }, null)?.plant;
    }

    function waterPlant(plant = plants[Math.floor(Math.random() * Math.max(1, plants.length))]) {
      if (!plant) return;
      plant.target = Math.min(1, plant.target + 0.28);
      const rect = canvas.getBoundingClientRect();
      const burst = settings.value.calmMode ? 3 : settings.particleCount(10);
      for (let i = 0; i < burst; i += 1) {
        drops.push({
          x: plant.x - 28 + Math.random() * 56,
          y: rect.height * 0.22 + Math.random() * 24,
          vy: 95 + Math.random() * 45,
          age: 0,
          life: 0.82 + Math.random() * 0.25
        });
      }
      status.textContent = plant.target >= 1 ? 'Flower blooming.' : 'Growing gently.';
      audio.tone('tap');
      renderHelper();
    }

    function bloomAll() {
      for (const plant of plants) plant.target = 1;
      if (!settings.value.calmMode && settings.value.particles !== 'off') {
        for (const plant of plants) {
          for (let i = 0; i < settings.particleCount(5); i += 1) {
            sparkles.push({ x: plant.x, y: plant.y - 72, vx: -28 + Math.random() * 56, vy: -35 - Math.random() * 35, age: 0, life: 0.9 });
          }
        }
      }
      status.textContent = 'Garden blooming.';
      audio.tone('success');
      renderHelper();
    }

    function drawPlant(plant, dt) {
      const speed = settings.allowsMotion() ? 4.8 : 18;
      plant.growth += (plant.target - plant.growth) * Math.min(1, dt * speed);
      const growth = plant.growth;
      const stem = 22 + growth * 92;
      const wobble = settings.allowsMotion() ? Math.sin(time * 1.5 + plant.wobble) * 3 * growth * settings.speedFactor() : 0;
      ctx.save();
      ctx.translate(plant.x, plant.y);
      ctx.strokeStyle = '#2f9f63';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(wobble, -stem * 0.35, -wobble, -stem * 0.72, wobble * 0.6, -stem);
      ctx.stroke();
      ctx.fillStyle = '#45c678';
      ctx.beginPath();
      ctx.ellipse(-18 - wobble, -stem * 0.45, 18 * growth, 9 * growth, -0.45, 0, Math.PI * 2);
      ctx.ellipse(18 + wobble, -stem * 0.58, 18 * growth, 9 * growth, 0.45, 0, Math.PI * 2);
      ctx.fill();
      if (growth > 0.62) {
        const bloom = (growth - 0.62) / 0.38;
        for (let i = 0; i < 7; i += 1) {
          const angle = i * Math.PI * 2 / 7 + 0.2;
          ctx.fillStyle = `hsl(${plant.hue}, 86%, ${64 + i % 2 * 8}%)`;
          ctx.beginPath();
          ctx.ellipse(wobble * 0.6 + Math.cos(angle) * 14 * bloom, -stem + Math.sin(angle) * 12 * bloom, 11 * bloom, 17 * bloom, angle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ffe36d';
        ctx.beginPath();
        ctx.arc(wobble * 0.6, -stem, 10 * bloom, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#6b5d31';
        ctx.beginPath();
        ctx.arc(0, -6, 9, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw(dt) {
      time += dt;
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      const sky = ctx.createLinearGradient(0, 0, 0, rect.height);
      sky.addColorStop(0, '#b9f2ff');
      sky.addColorStop(0.55, '#e8fbf0');
      sky.addColorStop(1, '#ffe6b6');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = 'rgba(255,255,255,.58)';
      for (let i = 0; i < 5; i += 1) {
        ctx.beginPath();
        ctx.ellipse(rect.width * (0.12 + i * 0.2), rect.height * (0.16 + (i % 2) * 0.05), 42, 15, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#9b7242';
      ctx.beginPath();
      ctx.ellipse(rect.width * 0.5, rect.height * 0.82, rect.width * 0.58, rect.height * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5f8f55';
      ctx.fillRect(0, rect.height * 0.82, rect.width, rect.height * 0.18);
      for (const plant of plants) drawPlant(plant, dt || 0.016);
      drops = drops.filter((drop) => drop.age < drop.life);
      for (const drop of drops) {
        drop.age += dt;
        if (settings.allowsMotion()) drop.y += drop.vy * settings.speedFactor() * dt;
        const alpha = Math.max(0, 1 - drop.age / drop.life);
        ctx.fillStyle = `rgba(59,161,255,${alpha})`;
        ctx.beginPath();
        ctx.ellipse(drop.x, drop.y, 4, 9, 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
      sparkles = sparkles.filter((sparkle) => sparkle.age < sparkle.life);
      for (const sparkle of sparkles) {
        sparkle.age += dt;
        if (settings.allowsMotion()) {
          sparkle.x += sparkle.vx * dt;
          sparkle.y += sparkle.vy * dt;
          sparkle.vy += 24 * dt;
        }
        const alpha = Math.max(0, 1 - sparkle.age / sparkle.life);
        ctx.fillStyle = `rgba(255,232,117,${alpha})`;
        ctx.beginPath();
        ctx.arc(sparkle.x, sparkle.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      if (plants.every((plant) => plant.target >= 1)) status.textContent = 'Garden blooming.';
    }

    const removeTick = motion.add((dt) => draw(dt));
    new LeonSalV2.InputEngine(canvas).onPointer({
      down: ({ x }) => {
        const rect = canvas.getBoundingClientRect();
        waterPlant(nearestPlant(x - rect.left));
      }
    });
    document.querySelector('#waterOne').addEventListener('click', () => waterPlant());
    document.querySelector('#bloomAll').addEventListener('click', bloomAll);
    document.querySelector('#reset').addEventListener('click', resetPlants);
    document.querySelectorAll('[data-garden]').forEach((button) => button.addEventListener('click', () => {
      mode = button.dataset.garden;
      document.querySelectorAll('[data-garden]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      resetPlants();
    }));
    settings.on('settings-change', resetPlants);
    window.addEventListener('resize', resize);
    resize();
    renderHelper();
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [audio], resources: [{ destroy: removeTick }], reset: resetPlants, gameId: 'growing-garden' });
    window.__growingGardenProofState = () => ({ mode, plants: plants.length, grown: plants.filter((plant) => plant.target > 0).length, blooms: plants.filter((plant) => plant.target >= 1).length, drops: drops.length, hasCharacterRenderer: Boolean(gardenHelper.querySelector('.procedural-character-svg.character-family-world')), calmMode: settings.value.calmMode, motion: settings.allowsMotion() });
  </script>
</body>
</html>
