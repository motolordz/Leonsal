name: Build LeonSal transparent character pilot v2

on:
  push:
    branches:
      - fix/character-art-pipeline-v2
    paths:
      - ".github/workflows/build-character-pilot-v2.yml"
      - "tools/build-character-pilot-v2.py"
      - "assets/source-safe-keeping/approved-character-sheets/leon-five-state-large.jpg"
      - "assets/source-safe-keeping/approved-character-sheets/zaya-five-state-large.jpg"
      - "assets/source-safe-keeping/approved-character-sheets/world-core-battery-elephant-bus-plane-boat-letter-a.jpg"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/character-art-pipeline-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image pipeline dependencies
        run: python -m pip install --upgrade pip pillow numpy opencv-python-headless

      - name: Normalize uploaded review-sheet dimensions for extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('assets/source-safe-keeping/approved-character-sheets')
          targets = {
              'leon-five-state-large.jpg': (1491, 1055),
              'zaya-five-state-large.jpg': (1491, 1055),
              'world-core-battery-elephant-bus-plane-boat-letter-a.jpg': (1122, 1402),
          }
          for name, size in targets.items():
              path = root / name
              image = Image.open(path).convert('RGB')
              if image.size != size:
                  image.resize(size, Image.Resampling.LANCZOS).save(path, 'JPEG', quality=96, subsampling=0)
                  print(f'Normalized {name}: {image.size} -> {size}')
              else:
                  print(f'{name} already matches {size}')
          PY

      - name: Build and pixel-verify 40 transparent PNG assets
        run: python tools/build-character-pilot-v2.py

      - name: Upload visual QA package
        uses: actions/upload-artifact@v4
        with:
          name: leonsal-character-pilot-v2-qa
          if-no-files-found: error
          retention-days: 14
          path: |
            assets/characters-v2/pilot-qa/pilot-40-checkerboard.jpg
            assets/characters-v2/leon/*.png
            assets/characters-v2/zaya/*.png
            assets/characters-v2/world/**/*.png

      - name: Commit generated production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters-v2 data/character-assets.json index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate clean transparent five-state pilot artwork"
          git push origin HEAD:fix/character-art-pipeline-v2
