<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day & Night</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Day &amp; Night</strong><span>Move the sky gently.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene day-night-world" id="world" aria-label="Day and night play area">
      <div class="sky-glow" aria-hidden="true"></div>
      <button class="sky-body sun-body" id="sun" type="button" aria-label="Choose daytime">Sun</button>
      <button class="sky-body moon-body" id="moon" type="button" aria-label="Choose nighttime">Moon</button>
      <div class="horizon" aria-hidden="true">
        <span class="hill hill-one"></span>
        <span class="hill hill-two"></span>
        <span class="quiet-house"></span>
      </div>
      <p class="scene-status" id="status">Morning light.</p>
      <p class="cycle-note">Simple day cycle, not a clock.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="next" type="button">Next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const cycle = new LeonSalV2.TimeCycleEngine([
      { id: 'morning', label: 'Morning light.' },
      { id: 'day', label: 'Bright day.' },
      { id: 'evening', label: 'Sunset glow.' },
      { id: 'night', label: 'Quiet night.' }
    ]);
    const input = new LeonSalV2.InputEngine(document.querySelector('#world'));
    const world = document.querySelector('#world');
    const sun = document.querySelector('#sun');
    const moon = document.querySelector('#moon');
    const status = document.querySelector('#status');
    let phaseIndex = 0;
    let dragActive = false;

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function applyPhase(index) {
      phaseIndex = Math.max(0, Math.min(3, index));
      cycle.set(phaseIndex);
      const item = cycle.sequence.current();
      world.dataset.phase = item.id;
      status.textContent = item.label;
      const sunX = [18, 50, 82, 94][phaseIndex];
      const sunY = [45, 18, 45, 78][phaseIndex];
      const moonX = [94, 82, 50, 18][phaseIndex];
      const moonY = [78, 60, 34, 22][phaseIndex];
      sun.style.setProperty('--x', `${sunX}%`);
      sun.style.setProperty('--y', `${sunY}%`);
      moon.style.setProperty('--x', `${moonX}%`);
      moon.style.setProperty('--y', `${moonY}%`);
    }

    function phaseFromPoint(point) {
      const rect = world.getBoundingClientRect();
      return Math.max(0, Math.min(3, Math.floor(((point.x - rect.left) / rect.width) * 4)));
    }

    input.onPointer({
      down: (point) => { dragActive = true; applyPhase(phaseFromPoint(point)); },
      move: (point) => { if (dragActive) applyPhase(phaseFromPoint(point)); },
      up: () => { dragActive = false; }
    });

    document.querySelector('#next').addEventListener('click', () => applyPhase((phaseIndex + 1) % 4));
    document.querySelector('#reset').addEventListener('click', () => applyPhase(0));
    sun.addEventListener('click', (event) => { event.stopPropagation(); applyPhase(1); });
    moon.addEventListener('click', (event) => { event.stopPropagation(); applyPhase(3); });

    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [input], reset: () => applyPhase(0), gameId: 'day-night-v2' });
    applyPhase(0);
    window.__dayNightProofState = () => ({
      phase: cycle.sequence.current().id,
      phaseIndex,
      hasTapAlternative: true,
      cycleNote: true,
      calmMode: settings.value.calmMode,
      reducedMotion: settings.value.reducedMotion || !settings.allowsMotion()
    });
  </script>
</body>
</html>
