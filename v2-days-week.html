<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days of the Week</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Days of the Week</strong><span>Step through the week.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene week-world" aria-label="Days of the week play area">
      <div class="week-ribbon" id="days"></div>
      <div class="week-card" id="activeDay" aria-live="polite">Monday</div>
      <p class="scene-status" id="status">Monday starts the school-week path.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="next" type="button">Next day</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const days = [
      { id: 'monday', label: 'Monday', cue: 'Monday starts the school-week path.' },
      { id: 'tuesday', label: 'Tuesday', cue: 'Tuesday comes next.' },
      { id: 'wednesday', label: 'Wednesday', cue: 'Wednesday sits in the middle.' },
      { id: 'thursday', label: 'Thursday', cue: 'Thursday follows Wednesday.' },
      { id: 'friday', label: 'Friday', cue: 'Friday finishes the school-week path.' },
      { id: 'saturday', label: 'Saturday', cue: 'Saturday begins the weekend.' },
      { id: 'sunday', label: 'Sunday', cue: 'Sunday completes the week.' }
    ];
    const sequence = new LeonSalV2.SequenceEngine(days);
    const daysHost = document.querySelector('#days');
    const activeDay = document.querySelector('#activeDay');
    const status = document.querySelector('#status');

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function renderButtons() {
      daysHost.innerHTML = '';
      days.forEach((day, index) => {
        const button = document.createElement('button');
        button.className = 'week-day';
        button.type = 'button';
        button.dataset.day = day.id;
        button.dataset.active = String(index === sequence.index);
        button.textContent = day.label.slice(0, 3);
        button.setAttribute('aria-label', `Choose ${day.label}`);
        button.addEventListener('click', () => {
          sequence.index = index;
          update();
        });
        daysHost.append(button);
      });
    }

    function update() {
      const current = sequence.current();
      activeDay.textContent = current.label;
      activeDay.dataset.day = current.id;
      status.textContent = current.cue;
      document.querySelectorAll('.week-day').forEach((button, index) => {
        button.dataset.active = String(index === sequence.index);
        button.dataset.past = String(index < sequence.index);
      });
    }

    function nextDay() {
      sequence.next();
      update();
    }

    function reset() {
      sequence.reset();
      renderButtons();
      update();
    }

    document.querySelector('#next').addEventListener('click', nextDay);
    document.querySelector('#reset').addEventListener('click', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [], reset, gameId: 'days-week-v2' });
    reset();
    window.__daysWeekProofState = () => ({
      day: sequence.current().label,
      index: sequence.index,
      count: days.length,
      hasTapAlternative: true,
      calmMode: settings.value.calmMode,
      reducedMotion: settings.value.reducedMotion
    });
  </script>
</body>
</html>
