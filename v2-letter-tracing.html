<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Tracing</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Letter Tracing</strong><span>Follow the soft letter path.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene letter-trace-world" aria-label="Letter tracing play area">
      <div class="trace-letter-ghost" aria-hidden="true" id="ghostLetter">A</div>
      <canvas id="letterTraceCanvas" class="trace-canvas" aria-label="Trace letter A. Drag along the path, or use the Step button."></canvas>
      <p class="scene-status" id="status">Trace letter A.</p>
      <div class="drawer-controls">
        <button class="scene-button" id="step" type="button">Step</button>
        <button class="scene-button" id="next" type="button">Next</button>
        <button class="scene-button" id="reset" type="button">Reset</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const canvas = document.querySelector('#letterTraceCanvas');
    const status = document.querySelector('#status');
    const ghost = document.querySelector('#ghostLetter');
    const letters = ['A', 'M', 'S'];
    let letterIndex = 0;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function currentLetter() { return letters[letterIndex]; }
    function makePath() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const letter = currentLetter();
      const points = [];
      const pushLine = (a, b, steps = 24) => {
        for (let i = 0; i <= steps; i += 1) points.push({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps });
      };
      if (letter === 'A') {
        pushLine({ x: w * .28, y: h * .72 }, { x: w * .5, y: h * .24 });
        pushLine({ x: w * .5, y: h * .24 }, { x: w * .72, y: h * .72 });
        pushLine({ x: w * .39, y: h * .53 }, { x: w * .61, y: h * .53 }, 16);
      } else if (letter === 'M') {
        pushLine({ x: w * .24, y: h * .72 }, { x: w * .24, y: h * .28 });
        pushLine({ x: w * .24, y: h * .28 }, { x: w * .5, y: h * .55 });
        pushLine({ x: w * .5, y: h * .55 }, { x: w * .76, y: h * .28 });
        pushLine({ x: w * .76, y: h * .28 }, { x: w * .76, y: h * .72 });
      } else {
        for (let i = 0; i < 72; i += 1) {
          const t = i / 71;
          points.push({ x: w * (.68 - .36 * Math.sin(t * Math.PI * 2)), y: h * (.28 + .44 * t) });
        }
      }
      return points;
    }
    const trace = new LeonSalV2.TraceEngine(canvas, motion, settings, { path: [], tolerance: 34 });
    function reset() {
      ghost.textContent = currentLetter();
      trace.setPath(makePath());
      status.textContent = `Trace letter ${currentLetter()}.`;
    }
    function add(x, y) {
      const rect = canvas.getBoundingClientRect();
      const result = trace.addPoint(x - rect.left, y - rect.top);
      status.textContent = result.complete ? `${currentLetter()} complete.` : result.near ? 'Keep tracing.' : 'Come back to the glow.';
    }
    new LeonSalV2.InputEngine(canvas).onPointer({ down: ({ x, y }) => add(x, y), move: ({ x, y }) => add(x, y) });
    document.querySelector('#step').addEventListener('click', () => {
      const point = trace.path[Math.min(trace.progress, trace.path.length - 1)];
      if (point) add(point.x + canvas.getBoundingClientRect().left, point.y + canvas.getBoundingClientRect().top);
    });
    document.querySelector('#next').addEventListener('click', () => { letterIndex = (letterIndex + 1) % letters.length; reset(); });
    document.querySelector('#reset').addEventListener('click', reset);
    window.addEventListener('resize', reset);
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [], resources: [trace], reset, gameId: 'letter-tracing-v2' });
    reset();
    window.__letterTracingProofState = () => ({ letter: currentLetter(), progress: trace.progress, complete: trace.progress >= trace.path.length, pathLength: trace.path.length, hasStepAlternative: true, calmMode: settings.value.calmMode, reducedMotion: settings.value.reducedMotion });
  </script>
</body>
</html>
