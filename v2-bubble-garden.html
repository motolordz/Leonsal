<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Garden Engine Proof</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body>
  <main class="v2-shell">
    <header class="v2-topbar">
      <div>
        <h1>Quiet Bubble Garden</h1>
        <p>Pop drifting bubbles at your own pace.</p>
      </div>
      <a class="v2-home" href="v2-proof-lab.html" aria-label="Proof lab">Lab</a>
    </header>
    <section class="v2-settings" id="settings" aria-label="Sensory settings"></section>
    <section class="v2-stage" aria-label="Bubble garden play area">
      <canvas class="bubble-canvas" id="canvas"></canvas>
    </section>
    <section class="v2-controls">
      <div class="control-row">
        <button id="reset" class="primary" type="button">Reset bubbles</button>
        <div class="segmented" aria-label="Bubble count">
          <button data-density="few" type="button">Few</button>
          <button data-density="normal" type="button" aria-pressed="true">Normal</button>
          <button data-density="many" type="button">Many</button>
        </div>
        <div class="segmented" aria-label="Bubble speed">
          <button data-speed="slow" type="button">Slow</button>
          <button data-speed="normal" type="button" aria-pressed="true">Normal</button>
        </div>
      </div>
      <p class="v2-status" id="status">Bubbles are drifting gently.</p>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const particles = new LeonSalV2.ParticleEngine(canvas, motion, settings);
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings);
    let density = 'normal';
    let speed = 'normal';
    const counts = { few: 12, normal: 24, many: 42 };
    function reset() {
      particles.seed('bubbles', counts[density]);
      const speedFactor = speed === 'slow' ? 0.45 : 1;
      particles.items.forEach((item) => { item.vx *= speedFactor; item.vy *= speedFactor; });
      status.textContent = 'Bubbles are ready.';
    }
    new LeonSalV2.InputEngine(canvas).onPointer({
      down: ({ x, y }) => {
        const rect = canvas.getBoundingClientRect();
        const popped = particles.popAt(x - rect.left, y - rect.top, 54);
        status.textContent = popped ? 'Bubble popped.' : 'Try another bubble.';
        if (popped) audio.tone('tap');
      }
    });
    document.querySelector('#reset').addEventListener('click', reset);
    document.querySelectorAll('[data-density]').forEach((button) => button.addEventListener('click', () => {
      density = button.dataset.density;
      document.querySelectorAll('[data-density]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      reset();
    }));
    document.querySelectorAll('[data-speed]').forEach((button) => button.addEventListener('click', () => {
      speed = button.dataset.speed;
      document.querySelectorAll('[data-speed]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      reset();
    }));
    reset();
    particles.start('bubbles');
  </script>
</body>
</html>
