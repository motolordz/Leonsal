<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Garden Engine Proof</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body>
  <main class="v2-shell">
    <header class="v2-topbar">
      <div>
        <h1>Bubble Garden</h1>
        <p>Tap, click or pen-tap bubbles with bounded particles.</p>
      </div>
      <a class="v2-home" href="index.html" aria-label="Back home">⌂</a>
    </header>
    <section class="v2-settings" id="settings" aria-label="Sensory settings"></section>
    <section class="v2-stage" aria-label="Bubble garden play area">
      <canvas class="bubble-canvas" id="canvas"></canvas>
    </section>
    <section class="v2-controls">
      <div class="control-row">
        <button id="reset" class="primary" type="button">Reset bubbles</button>
        <button id="density" type="button">Gentle density</button>
      </div>
      <p class="v2-status" id="status">Bubbles are drifting gently.</p>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const particles = new LeonSalV2.ParticleEngine(canvas, motion, settings);
    let gentle = true;
    function renderSettings() {
      document.querySelector('#settings').innerHTML = ['motion','sound','vibration','calmMode','confetti'].map((key) => `<button type="button" data-key="${key}" aria-pressed="${Boolean(settings.value[key])}">${key}</button>`).join('');
      document.querySelectorAll('[data-key]').forEach((button) => button.addEventListener('click', () => {
        settings.set({ [button.dataset.key]: !settings.value[button.dataset.key] });
        particles.seed(gentle ? 24 : 42);
        renderSettings();
      }));
    }
    function reset() {
      particles.seed(gentle ? 24 : 42);
      status.textContent = gentle ? 'Bubbles are drifting gently.' : 'More bubbles are ready to pop.';
    }
    new LeonSalV2.InputEngine(canvas).onPointer({
      down: ({ x, y }) => {
        const rect = canvas.getBoundingClientRect();
        const popped = particles.popAt(x - rect.left, y - rect.top, 54);
        status.textContent = popped ? 'Bubble popped.' : 'Try another bubble.';
        if (popped) audio.tone('tap');
      }
    });
    document.querySelector('#reset').addEventListener('click', reset);
    document.querySelector('#density').addEventListener('click', () => {
      gentle = !gentle;
      document.querySelector('#density').textContent = gentle ? 'Gentle density' : 'More bubbles';
      reset();
    });
    renderSettings();
    reset();
    particles.start('bubbles');
  </script>
</body>
</html>
