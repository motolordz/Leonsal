<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dash to Charging Dock</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-proof-lab.html" aria-label="Back to proof hub">‹</a>
      <div class="game-title"><strong>Dash to Charging Dock</strong><span>Travel first. Charge at the dock.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene dash-world" id="stage" aria-label="Dash to the charging dock">
      <div class="dash-sky" aria-hidden="true"></div>
      <div class="dash-hills" aria-hidden="true"></div>
      <div class="helper-lamp" id="helper" data-active="false" aria-hidden="true"></div>
      <div class="dash-path-new" id="path" aria-hidden="true"></div>
      <div class="charge-beam" id="beam" aria-hidden="true"></div>
      <div class="dock-cable" id="cable" aria-hidden="true"></div>
      <div class="energy-buddy" id="runner" data-state="empty" aria-label="Energy buddy">
        <span class="energy-buddy-aura"></span>
        <span class="energy-buddy-arm left"></span><span class="energy-buddy-arm right"></span>
        <span class="energy-buddy-body"></span>
        <span class="energy-buddy-cheek left"></span><span class="energy-buddy-cheek right"></span>
        <span class="energy-buddy-eye left"></span><span class="energy-buddy-eye right"></span>
        <span class="energy-buddy-mouth"></span>
        <span class="energy-buddy-foot left"></span><span class="energy-buddy-foot right"></span>
      </div>
      <div class="charging-dock" id="dock" data-charging="false" aria-label="Charging dock"></div>
      <p class="scene-status" id="status">Battery empty — reach the charging dock.</p>
      <div class="floating-controls">
        <button id="left" class="scene-button" type="button">Left</button>
        <button id="right" class="scene-button" type="button">Move right</button>
        <button id="reset" class="scene-button" type="button">Start again</button>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const stage = document.querySelector('#stage');
    const runner = document.querySelector('#runner');
    const dock = document.querySelector('#dock');
    const helper = document.querySelector('#helper');
    const beam = document.querySelector('#beam');
    const status = document.querySelector('#status');
    let dashPosition = 0;
    let energy = 0;
    let charging = false;
    let charged = false;
    let walkTime = 0;
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings);
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function travelDistance() {
      const stageRect = stage.getBoundingClientRect();
      const runnerRect = runner.getBoundingClientRect();
      const dockRect = dock.getBoundingClientRect();
      return Math.max(0, stageRect.width - runnerRect.width - dockRect.width - 54);
    }
    function render() {
      const state = LeonSalV2.stateForEnergy(energy);
      runner.dataset.state = state;
      stage.style.setProperty('--dash-x', `${travelDistance() * dashPosition / 100}px`);
      stage.style.setProperty('--dash-scale', charging && settings.allowsMotion() ? '1.08' : '1');
      stage.style.setProperty('--buddy-hue', String(6 + energy * 1.1));
      stage.style.setProperty('--eye-open', String(.42 + energy / 170));
      stage.style.setProperty('--beam-alpha', charging ? String(.25 + energy / 135) : '0');
      beam.style.width = charging ? `${Math.max(90, travelDistance() * .55)}px` : '0px';
      cable.dataset.connected = String(charging || charged);
      dock.dataset.charging = String(charging);
    }
    function setPosition(value) {
      if (charging) return;
      dashPosition = LeonSalV2.clamp(Number(value), 0, 100);
      if (!charged) energy = 0;
      render();
      if (dashPosition >= 95) charge();
      else status.textContent = dashPosition === 0 ? 'Battery empty — reach the charging dock.' : 'Keep going to the charging dock!';
    }
    function stepRight(delta) {
      const from = dashPosition;
      const to = LeonSalV2.clamp(from + delta, 0, 100);
      motion.tween({ from, to, duration: 360, onUpdate: (value) => setPosition(value) });
    }
    function charge() {
      if (charging || charged) return;
      dashPosition = 100;
      charging = true;
      status.textContent = 'Charging…';
      motion.tween({ from: 0, to: 100, duration: 1900, onUpdate: (value) => {
        energy = value;
        render();
      }, onComplete: () => {
        energy = 100;
        charged = true;
        charging = false;
        helper.dataset.active = 'true';
        status.textContent = 'Fully charged!';
        render();
        audio.tone('success');
      }});
    }
    function reset() {
      dashPosition = 0;
      energy = 0;
      charging = false;
      charged = false;
      helper.dataset.active = 'false';
      status.textContent = 'Battery empty — reach the charging dock.';
      render();
    }
    motion.add((dt) => {
      walkTime += dt;
      const moving = dashPosition > 0 && dashPosition < 100 && !charging && settings.allowsMotion();
      stage.style.setProperty('--buddy-hop', moving ? `${Math.sin(walkTime * 10) * -5}px` : '0px');
      stage.style.setProperty('--arm-angle', moving ? `${18 + Math.sin(walkTime * 9) * 14}deg` : '18deg');
      stage.style.setProperty('--foot-a', moving ? `${Math.sin(walkTime * 12) * 5}px` : '0px');
      stage.style.setProperty('--foot-b', moving ? `${Math.sin(walkTime * 12 + Math.PI) * 5}px` : '0px');
    });
    new LeonSalV2.InputEngine(stage).onPointer({
      down: ({ x }) => {
        const rect = stage.getBoundingClientRect();
        if (x > rect.left + rect.width * .42) stepRight(18);
      }
    });
    document.querySelector('#left').addEventListener('click', () => { audio.tone('tap'); stepRight(-15); });
    document.querySelector('#right').addEventListener('click', () => { audio.tone('tap'); stepRight(18); });
    document.querySelector('#reset').addEventListener('click', reset);
    window.addEventListener('resize', render);
    reset();
  </script>
</body>
</html>
