<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Energy Battery</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-proof-lab.html" aria-label="Back to proof hub">‹</a>
      <div class="game-title"><strong>My Energy Battery</strong><span>Swipe the energy track.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>
    <section class="game-scene energy-world" id="scene" aria-label="Interactive energy battery">
      <p class="scene-status" id="status">Empty / Sleepy</p>
      <div class="energy-glow" id="glow" aria-hidden="true"></div>
      <div class="energy-pad" aria-hidden="true"></div>
      <svg class="big-battery" id="batterySvg" viewBox="0 0 430 300" role="img" aria-labelledby="batteryTitle batteryDesc">
        <title id="batteryTitle">Interactive energy battery</title>
        <desc id="batteryDesc">A continuous battery gauge from empty to full.</desc>
        <g class="battery-spark">
          <circle cx="64" cy="58" r="8" fill="#ffd84d"/>
          <circle cx="354" cy="246" r="10" fill="#ffd84d"/>
          <path d="M356 36l10 20 21 3-15 15 4 21-20-10-19 10 4-21-15-15 21-3z" fill="#ffd84d"/>
        </g>
        <g class="battery-shell-tilt" id="batteryTilt">
          <rect x="34" y="70" width="330" height="150" rx="42" fill="#fff" stroke="#132343" stroke-width="12"/>
          <rect x="370" y="112" width="34" height="66" rx="13" fill="#132343"/>
          <clipPath id="batteryClip"><rect x="52" y="88" width="294" height="114" rx="30"/></clipPath>
          <rect x="52" y="88" width="294" height="114" rx="30" fill="#edf3fb"/>
          <rect data-fill x="52" y="88" width="0" height="114" rx="30" fill="#ef6f66" clip-path="url(#batteryClip)"/>
          <circle class="battery-face-eye" cx="164" cy="140" r="12" fill="#132343"/>
          <circle class="battery-face-eye" cx="238" cy="140" r="12" fill="#132343"/>
          <path data-face d="M176 174 Q201 154 226 174" fill="none" stroke="#132343" stroke-width="9" stroke-linecap="round"/>
          <text data-label x="200" y="266" text-anchor="middle" font-size="28" font-weight="900" fill="#132343">0%</text>
        </g>
      </svg>
      <div class="energy-track" id="energyTrack" role="slider" aria-label="Energy level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="energy-track-fill"></div>
        <div class="energy-thumb"></div>
      </div>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const gauge = new LeonSalV2.GaugeBattery(document.querySelector('#batterySvg'));
    const track = document.querySelector('#energyTrack');
    const scene = document.querySelector('#scene');
    const status = document.querySelector('#status');
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings);
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });
    function render(value) {
      const next = LeonSalV2.clamp(Number(value), 0, 100);
      const result = gauge.set(next);
      track.style.setProperty('--track-fill', `${next}%`);
      track.style.setProperty('--track-thumb', `${8 + (next * .84)}%`);
      track.setAttribute('aria-valuenow', String(Math.round(next)));
      scene.style.setProperty('--energy-glow', String(.06 + next / 160));
      scene.style.setProperty('--battery-tilt', `${-5 + next * .07}deg`);
      scene.style.setProperty('--battery-lift', `${10 - next * .12}px`);
      status.textContent = result.label;
    }
    function valueFromPoint(x) {
      const rect = track.getBoundingClientRect();
      return LeonSalV2.clamp(((x - rect.left) / rect.width) * 100, 0, 100);
    }
    new LeonSalV2.InputEngine(track).onPointer({
      down: ({ x }) => render(valueFromPoint(x)),
      move: ({ x }) => render(valueFromPoint(x))
    });
    track.addEventListener('keydown', (event) => {
      const current = Number(track.getAttribute('aria-valuenow'));
      if (event.key === 'ArrowLeft') render(current - 5);
      if (event.key === 'ArrowRight') render(current + 5);
      if (event.key === 'Home') render(0);
      if (event.key === 'End') render(100);
    });
    render(0);
  </script>
</body>
</html>
