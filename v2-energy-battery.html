<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeonSal V2 Proof — My Energy Battery</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body>
  <main class="v2-shell">
    <header class="v2-topbar">
      <div><h1>My Energy Battery</h1><p>Slide from empty to full and watch the battery respond.</p></div>
      <a class="v2-home" href="v2-proof-lab.html" aria-label="Proof lab">Lab</a>
    </header>
    <section class="v2-settings" id="settings"></section>
    <section class="v2-stage battery-proof" aria-label="Energy battery proof">
      <svg class="battery-svg" viewBox="0 0 430 220" role="img" aria-labelledby="batteryTitle batteryDesc">
        <title id="batteryTitle">Interactive energy battery</title>
        <desc id="batteryDesc">A continuous battery gauge from empty to full.</desc>
        <g class="battery-spark">
          <circle cx="72" cy="30" r="8" fill="#ffd84d"/>
          <circle cx="344" cy="188" r="10" fill="#ffd84d"/>
          <path d="M356 26l10 20 21 3-15 15 4 21-20-10-19 10 4-21-15-15 21-3z" fill="#ffd84d"/>
        </g>
        <rect x="28" y="48" width="340" height="124" rx="34" fill="#fff" stroke="#132343" stroke-width="10"/>
        <rect x="374" y="82" width="34" height="56" rx="12" fill="#132343"/>
        <rect data-fill x="42" y="62" width="0" height="96" rx="24" fill="#ef6f66"/>
        <circle class="battery-face-eye" cx="160" cy="108" r="10" fill="#132343"/>
        <circle class="battery-face-eye" cx="236" cy="108" r="10" fill="#132343"/>
        <path data-face d="M174 132 Q198 148 222 132" fill="none" stroke="#132343" stroke-width="8" stroke-linecap="round"/>
        <text data-label x="198" y="205" text-anchor="middle" font-size="26" font-weight="900" fill="#132343">0%</text>
      </svg>
    </section>
    <section class="v2-controls">
      <div class="control-row">
        <button id="empty" type="button">Empty</button>
        <input id="energy" type="range" min="0" max="100" value="0">
        <button id="full" class="primary" type="button">Full</button>
      </div>
      <p class="v2-status" id="status">Empty / Sleepy</p>
    </section>
  </main>
  <script src="v2-engine.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const gauge = new LeonSalV2.GaugeBattery(document.querySelector('.battery-svg'));
    const input = document.querySelector('#energy');
    const status = document.querySelector('#status');
    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings);
    function setEnergy(value, animate = true) {
      const from = Number(input.value);
      const to = LeonSalV2.clamp(Number(value), 0, 100);
      motion.tween({ from, to, duration: animate ? 520 : 0, onUpdate: (next) => {
        input.value = String(Math.round(next));
        const result = gauge.set(next);
        status.textContent = result.label;
      }});
    }
    input.addEventListener('input', () => setEnergy(input.value, false));
    document.querySelector('#empty').addEventListener('click', () => { audio.tone('tap'); setEnergy(0); });
    document.querySelector('#full').addEventListener('click', () => { audio.tone('success'); setEnergy(100); });
    setEnergy(0, false);
  </script>
</body>
</html>
