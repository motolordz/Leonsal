<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Merge</title>
  <link rel="stylesheet" href="v2-proofs.css">
</head>
<body class="v2-experience">
  <main class="game-shell">
    <header class="game-topbar">
      <a class="icon-button" href="v2-home.html" aria-label="Home">‹</a>
      <div class="game-title"><strong>Number Merge</strong><span>Touch two number friends and see them join.</span></div>
      <button class="icon-button" id="settingsToggle" type="button" aria-label="Sensory settings" aria-expanded="false">⚙</button>
      <div class="settings-popover" id="settings"></div>
    </header>

    <section class="game-scene number-world" aria-label="Number merge play area">
      <div class="number-sky" aria-hidden="true"></div>
      <div class="number-equation" aria-live="polite">
        <span id="firstSlot" class="number-slot">?</span>
        <span class="number-symbol">+</span>
        <span id="secondSlot" class="number-slot">?</span>
        <span class="number-symbol">=</span>
        <span id="resultSlot" class="number-result">?</span>
      </div>
      <div class="number-mat" id="numberMat" aria-label="Choose two numbers">
        <button class="number-buddy" type="button" data-value="1">1</button>
        <button class="number-buddy" type="button" data-value="2">2</button>
        <button class="number-buddy" type="button" data-value="3">3</button>
        <button class="number-buddy" type="button" data-value="4">4</button>
        <button class="number-buddy" type="button" data-value="5">5</button>
      </div>
      <p class="scene-status" id="status">Pick two numbers.</p>
      <div class="drawer-controls">
        <button id="merge" class="scene-button" type="button">Merge</button>
        <button id="clear" class="scene-button" type="button">Clear</button>
        <button class="mode-pill" data-mode="small" type="button" aria-pressed="true">Small</button>
        <button class="mode-pill" data-mode="bigger" type="button">Bigger</button>
      </div>
    </section>
  </main>

  <script src="v2-engine.js"></script>
  <script src="js/v2-game-shell.js"></script>
  <script src="js/v2-character-renderer.js"></script>
  <script>
    const settings = new LeonSalV2.SensorySettings();
    const motion = new LeonSalV2.MotionEngine(settings);
    const audio = new LeonSalV2.AudioEngine(settings);
    const dragDrop = new LeonSalV2.DragDropEngine({ snapDistance: 90 });
    const firstSlot = document.querySelector('#firstSlot');
    const secondSlot = document.querySelector('#secondSlot');
    const resultSlot = document.querySelector('#resultSlot');
    const status = document.querySelector('#status');
    const mat = document.querySelector('#numberMat');
    const mergeButton = document.querySelector('#merge');
    let selected = [];
    let result = null;
    let mode = 'small';
    let pulse = 0;

    function numberRecord(value) {
      return {
        id: `number-${value}`,
        displayName: `Number ${value}`,
        family: 'number'
      };
    }

    function renderNumberCharacter(value, state = 'calm') {
      const renderer = window.LeonSalCharacterRenderer;
      if (!renderer) return document.createTextNode(String(value));
      return renderer.makeCharacter(numberRecord(value), state, { decorative: false });
    }

    new LeonSalV2.SettingsPanel(document.querySelector('#settings'), settings, { keys: LeonSalGameShell.sensoryKeys });
    document.querySelector('#settingsToggle').addEventListener('click', () => {
      const panel = document.querySelector('#settings');
      const open = panel.dataset.open !== 'true';
      panel.dataset.open = String(open);
      document.querySelector('#settingsToggle').setAttribute('aria-expanded', String(open));
    });

    function valuesForMode() {
      return mode === 'bigger' ? [2, 4, 5, 6, 8] : [1, 2, 3, 4, 5];
    }

    function renderMat() {
      mat.innerHTML = '';
      valuesForMode().forEach((value, index) => {
        const button = document.createElement('button');
        button.className = 'number-buddy';
        button.type = 'button';
        button.dataset.value = String(value);
        button.style.setProperty('--hue', String((index * 48 + value * 17) % 360));
        button.replaceChildren(renderNumberCharacter(value, 'calm'));
        button.addEventListener('click', () => choose(value, button));
        dragDrop.register(button, mat, { select: () => choose(value, button) });
        mat.append(button);
      });
    }

    function choose(value, button) {
      if (selected.length >= 2) selected = [];
      selected.push(value);
      result = null;
      audio.tone('tap');
      document.querySelectorAll('.number-buddy').forEach((item) => item.dataset.selected = 'false');
      button.dataset.selected = 'true';
      update();
      if (selected.length === 2) mergeNumbers();
    }

    function mergeNumbers() {
      if (selected.length < 2) {
        status.textContent = 'Pick two numbers.';
        return;
      }
      result = selected[0] + selected[1];
      pulse = settings.value.calmMode ? 0.45 : 1;
      status.textContent = `${selected[0]} and ${selected[1]} make ${result}.`;
      audio.tone('success');
      update();
    }

    function clear() {
      selected = [];
      result = null;
      pulse = 0;
      document.querySelectorAll('.number-buddy').forEach((item) => item.dataset.selected = 'false');
      status.textContent = 'Pick two numbers.';
      update();
    }

    function update() {
      firstSlot.replaceChildren(selected[0] ? renderNumberCharacter(selected[0], 'happy') : document.createTextNode('?'));
      secondSlot.replaceChildren(selected[1] ? renderNumberCharacter(selected[1], 'happy') : document.createTextNode('?'));
      resultSlot.replaceChildren(result ? renderNumberCharacter(result, 'excited') : document.createTextNode('?'));
      mergeButton.disabled = selected.length < 2;
      resultSlot.dataset.ready = String(result !== null);
    }

    function animate(dt) {
      if (!settings.allowsMotion()) return;
      pulse = Math.max(0, pulse - dt * settings.speedFactor());
      const scale = 1 + Math.sin(pulse * Math.PI * 4) * 0.05 * pulse;
      resultSlot.style.transform = `scale(${scale})`;
    }

    document.querySelector('#merge').addEventListener('click', mergeNumbers);
    document.querySelector('#clear').addEventListener('click', clear);
    document.querySelectorAll('[data-mode]').forEach((button) => button.addEventListener('click', () => {
      mode = button.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      renderMat();
      clear();
    }));
    const removeTick = motion.add(animate);
    renderMat();
    update();
    const gameShell = new LeonSalGameShell({ settings, motions: [motion], audio: [audio], resources: [{ destroy: removeTick }, dragDrop], reset: clear, gameId: 'number-merge-v2' });
    window.__numberMergeProofState = () => ({ selected: [...selected], result, mode, motion: settings.allowsMotion(), calmMode: settings.value.calmMode });
  </script>
</body>
</html>
